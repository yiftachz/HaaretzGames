<!DOCTYPE html>
<html lang="he" dir="rtl">

    <meta charset="UTF-8">

    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&family=Heebo:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Assistant', 'Heebo', sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            overflow-x: hidden;
        }

        ::-webkit-scrollbar-thumb:hover { background: #52525b; }

        .toast-leave { animation: fadeOut 0.3s forwards; }
        @keyframes slideInDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeOut { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-10px); } }
    </style>
</head>

                    <h1 class="font-extrabold text-xl text-white tracking-wide">פורטל המשחקים</h1>

            </div>
            <div class="flex items-center gap-2">
                <button onclick="router.navigate('hub')" class="px-3 py-1.5 rounded-lg bg-zinc-800 hover:bg-zinc-700 text-sm font-semibold text-zinc-200 transition">ראשי</button>
                <button onclick="router.navigate('adminHub')" class="px-3 py-1.5 rounded-lg bg-zinc-800 hover:bg-zinc-700 text-sm font-semibold text-amber-400 transition">⚙️ ניהול</button>

    <div id="toast-container" class="fixed top-20 left-1/2 transform -translate-x-1/2 z-50 flex flex-col gap-2 pointer-events-none w-full max-w-sm px-4"></div>

    <main id="app" class="flex-1 max-w-6xl w-full mx-auto p-4 sm:p-6"></main>

    <footer class="border-t border-zinc-800 py-6 text-center text-xs text-zinc-500 bg-zinc-950 mt-auto">
        <p>פורטל משחקים עברי מתקדם • סנכרון GitHub מלא</p>
    </footer>

        };

        function getGitHubConfig() {
            try {
                const conf = localStorage.getItem('hebrew_portal_gh_config');
                return conf ? JSON.parse(conf) : { owner: '', repo: '', branch: 'main', path: 'puzzles.json', token: '' };
            } catch (e) {
                return { owner: '', repo: '', branch: 'main', path: 'puzzles.json', token: '' };
            }
        }

        function saveGitHubConfig(config) {
            localStorage.setItem('hebrew_portal_gh_config', JSON.stringify(config));
        }

        function getAppData() {
            try {
                const saved = localStorage.getItem('hebrew_game_portal_v3');
                if (saved) return JSON.parse(saved);
            } catch (e) {}
            return DEFAULT_DATA;
        }

        function saveAppData(data) { 
            localStorage.setItem('hebrew_game_portal_v3', JSON.stringify(data)); 
        }

        async function syncFetchFromGitHub() {
            const cfg = getGitHubConfig();
            if (!cfg.owner || !cfg.repo || !cfg.path) {
                throw new Error('הגדרות GitHub חסרות');
            }
            const url = `https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${cfg.path}?ref=${cfg.branch}`;
            const headers = { 'Accept': 'application/vnd.github.v3+json' };
            if (cfg.token) headers['Authorization'] = `token ${cfg.token}`;

            const res = await fetch(url, { headers });
            if (!res.ok) throw new Error('שגיאה בטעינה מ-GitHub');
            const json = await res.json();
            const content = JSON.parse(decodeURIComponent(escape(atob(json.content))));
            saveAppData(content);
            return { content, sha: json.sha };
        }

        async function syncPushToGitHub(dataObj, commitMsg = "Update game data via Portal Admin") {
            const cfg = getGitHubConfig();
            if (!cfg.owner || !cfg.repo || !cfg.path || !cfg.token) {
                throw new Error('חסרים פרטי חיבור או טוקן GitHub');
            }
            const url = `https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${cfg.path}`;
            const headers = { 'Accept': 'application/vnd.github.v3+json', 'Authorization': `token ${cfg.token}`, 'Content-Type': 'application/json' };

            // Get current file SHA
            let sha = '';
            try {
                const getRes = await fetch(`${url}?ref=${cfg.branch}`, { headers: { 'Accept': headers['Accept'], 'Authorization': headers['Authorization'] } });
                if (getRes.ok) {
                    const j = await getRes.json();
                    sha = j.sha;
                }
            } catch (e) {}

            const contentEncoded = btoa(unescape(encodeURIComponent(JSON.stringify(dataObj, null, 2))));
            const body = {
                message: commitMsg,
                content: contentEncoded,
                branch: cfg.branch
            };
            if (sha) body.sha = sha;

            const res = await fetch(url, { method: 'PUT', headers, body: JSON.stringify(body) });
            if (!res.ok) {
                const errJson = await res.json().catch(() => ({}));
                throw new Error(errJson.message || 'שגיאה בשמירה ל-GitHub');
            }
            return await res.json();
        }

        async function uploadImageToGitHub(base64Data, remotePath, commitMessage) {
            const cfg = getGitHubConfig();
            if (!cfg.owner || !cfg.repo || !cfg.token) throw new Error('חסר טוקן או הגדרות GitHub');
            const url = `https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${remotePath}`;
            const headers = { 'Accept': 'application/vnd.github.v3+json', 'Authorization': `token ${cfg.token}`, 'Content-Type': 'application/json' };

            let sha = '';
            try {
                const getRes = await fetch(`${url}?ref=${cfg.branch}`, { headers: { 'Accept': headers['Accept'], 'Authorization': headers['Authorization'] } });
                if (getRes.ok) {
                    const j = await getRes.json();
                    sha = j.sha;
                }
            } catch (e) {}

            // Extract base64 raw string
            const base64Content = base64Data.includes('base64,') ? base64Data.split('base64,')[1] : base64Data;
            const body = {
                message: commitMessage,
                content: base64Content,
                branch: cfg.branch
            };
            if (sha) body.sha = sha;

            const res = await fetch(url, { method: 'PUT', headers, body: JSON.stringify(body) });
            if (!res.ok) throw new Error('שגיאה בהעלאת התמונה ל-GitHub');
            return await res.json();
        }

        function showToast(msg, isError = false) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast-enter p-3 rounded-xl text-center font-bold text-sm shadow-xl ${isError ? 'bg-red-600 text-white' : 'bg-yellow-500 text-black'}`;
            toast.innerText = msg;
            container.appendChild(toast);
            setTimeout(() => {
                toast.classList.replace('toast-enter', 'toast-leave');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        async function fileToBase64(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX = 400;
                        let w = img.width, h = img.height;
                        if (w > MAX || h > MAX) {
                            if (w > h) { h *= MAX / w; w = MAX; } else { w *= MAX / h; h = MAX; }
                        }
                        canvas.width = w; canvas.height = h;
                        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                        resolve(canvas.toDataURL('image/jpeg', 0.7));
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        const router = {
            navigate: function(route, params = {}) {
                window.scrollTo(0, 0);
                const app = document.getElementById('app');
                app.innerHTML = '';
                if (route === 'hub') renderHub(app);
                else if (route === 'game') renderGame(app, params.gameId, params.puzzleIndex || 0);
                else if (route === 'adminHub') renderAdminHub(app);
                else if (route === 'adminGame') renderAdminGame(app, params.gameId);
                else if (route === 'adminForm') renderAdminForm(app, params.gameId, params.puzzleIndex);
            }
        };

        function renderHub(container) {
            const gamesList = [
                { id: 'connections', title: 'קשרים (Connections)', desc: 'מצאו 4 קבוצות של 4 מילים קשורות', icon: '🧩', color: 'from-amber-500/20 to-yellow-500/10' },
                { id: 'chain', title: 'השרשרת (Chain)', desc: 'סדרו את חוליות הביניים בסדר הגיוני', icon: '🔗', color: 'from-blue-500/20 to-indigo-500/10' },
                { id: 'wordle', title: 'וורדל 6 אותיות', desc: 'נחשו את המילה עם משוב חכם', icon: '🔤', color: 'from-emerald-500/20 to-teal-500/10' },
                { id: 'questions20', title: '20 שאלות + בונוס', desc: 'שאלון מדורג עם מעקב V/X', icon: '❓', color: 'from-purple-500/20 to-pink-500/10' },
                { id: 'logicRiddle', title: 'הגיונית', desc: 'פתרו את חידת ההגיון', icon: '💡', color: 'from-orange-500/20 to-amber-500/10' },
                { id: 'progressiveImage', title: 'מי אני?', desc: 'זהו את הדמות לפי רזולוציות מתקדמות', icon: '👤', color: 'from-rose-500/20 to-red-500/10' },
            ];

            container.innerHTML = `
                <div class="space-y-8 py-4">
                    <div class="text-center space-y-3 max-w-2xl mx-auto">
                        <h2 class="text-3xl sm:text-4xl font-black text-white tracking-tight">בחר משחק והתחל לשחק</h2>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                        ${gamesList.map(g => `
                            <div class="game-card bg-zinc-900 border border-zinc-700/50 rounded-2xl p-6 flex flex-col justify-between bg-gradient-to-br ${g.color}">
                                <div>
                                    <div class="text-4xl mb-4">${g.icon}</div>
                                    <h3 class="text-xl font-bold text-white mb-2">${g.title}</h3>
                                    <p class="text-zinc-400 text-sm mb-6">${g.desc}</p>
                                </div>
                                <div class="pt-4 border-t border-zinc-800/85">
                                    <button onclick="router.navigate('game', {gameId: '${g.id}', puzzleIndex: 0})" class="w-full bg-yellow-500 hover:bg-yellow-400 text-black font-bold py-2.5 rounded-xl text-sm transition shadow-lg">שחק</button>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderNextPuzzleButton(gameId, currentIndex, totalPuzzles) {
            if (currentIndex < totalPuzzles - 1) {
                return `<button onclick="router.navigate('game', {gameId: '${gameId}', puzzleIndex: ${currentIndex + 1}})" class="px-6 py-3 mt-4 w-full bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-xl shadow-lg transition">המשך לחידה הבאה ➡️</button>`;
            }
            return `<p class="mt-4 text-sm text-zinc-500 font-bold">פתרת את כל החידות במשחק זה!</p>`;
        }

        function renderGame(container, gameId, puzzleIndex) {
            const data = getAppData();
            const gameData = data[gameId];
            if (!gameData || !gameData.puzzles || gameData.puzzles.length <= puzzleIndex) {
                container.innerHTML = `<div class="text-center py-16 space-y-4"><h3 class="text-2xl font-bold text-white">אין חידה זמינה</h3><button onclick="router.navigate('hub')" class="px-6 py-2 bg-yellow-500 text-black font-bold rounded-xl">חזרה לראשי</button></div>`;
                return;
            }
            const puzzle = gameData.puzzles[puzzleIndex];
            const total = gameData.puzzles.length;

            if (gameId === 'connections') initConnections(container, puzzle, gameId, puzzleIndex, total);
            else if (gameId === 'chain') initChain(container, puzzle, gameId, puzzleIndex, total);
            else if (gameId === 'wordle') initWordle(container, puzzle, gameId, puzzleIndex, total);
            else if (gameId === 'questions20') init20Questions(container, puzzle, gameId, puzzleIndex, total);
            else if (gameId === 'logicRiddle') initLogicRiddle(container, puzzle, gameId, puzzleIndex, total);
            else if (gameId === 'progressiveImage') initProgressiveImage(container, puzzle, gameId, puzzleIndex, total);
        }

        function initConnections(container, puzzle, gameId, puzzleIndex, totalPuzzles) {
            let allWords = [];
            puzzle.groups.forEach((g, gIdx) => g.words.forEach(w => allWords.push({ text: w, groupIdx: gIdx })));
            allWords.sort(() => Math.random() - 0.5);

            let selected = [];
            let solvedGroups = [];
            let mistakes = 4;

            function render() {
                container.innerHTML = `
                    <div class="max-w-xl mx-auto space-y-6 py-4">
                        <div class="flex justify-between items-center border-b border-zinc-800 pb-2">
                            <button onclick="router.navigate('hub')" class="text-sm text-zinc-400">חזרה</button>
                            <h2 class="text-xl font-bold text-white">${puzzle.name || 'קשרים'}</h2>
                            <div class="text-amber-400 font-bold text-sm">טעויות: ${mistakes}</div>
                        </div>
                        <div class="space-y-3">
                            ${solvedGroups.map(sg => `<div class="p-3 rounded-xl bg-amber-500/20 border border-amber-500/40 text-center"><div class="font-bold text-amber-300">${sg.category}</div><div class="text-sm text-zinc-200">${sg.words.join(', ')}</div></div>`).join('')}
                        </div>
                        ${solvedGroups.length === 4 ? `
                            <div class="p-6 bg-emerald-900/40 border border-emerald-500 rounded-xl text-center">
                                <h3 class="text-2xl font-bold text-emerald-400 mb-4">כל הכבוד!</h3>
                                ${renderNextPuzzleButton(gameId, puzzleIndex, totalPuzzles)}
                            </div>
                        ` : mistakes <= 0 ? `
                            <div class="p-6 bg-red-900/40 border border-red-500 rounded-xl text-center">
                                <h3 class="text-2xl font-bold text-red-400 mb-4">נגמרו הנסיונות!</h3>
                                <button onclick="router.navigate('game', {gameId: '${gameId}', puzzleIndex: ${puzzleIndex}})" class="px-6 py-2 bg-zinc-800 text-white rounded-xl">נסה שוב</button>
                            </div>
                        ` : `
                            <div class="grid grid-cols-4 gap-2 sm:gap-3">
                                ${allWords.map((w, i) => `<button onclick="con_toggle('${w.text}')" class="p-2 sm:p-4 rounded-lg font-bold text-xs sm:text-base transition border ${selected.includes(w.text) ? 'bg-amber-500 text-black border-amber-400 scale-95' : 'bg-zinc-800 text-zinc-200 border-zinc-700'}">${w.text}</button>`).join('')}
                            </div>
                            <div class="flex gap-2 justify-center pt-2">
                                <button onclick="con_shuffle()" class="px-4 py-2 bg-zinc-800 text-white rounded-lg">ערבוב</button>
                                <button onclick="con_clear()" class="px-4 py-2 bg-zinc-800 text-white rounded-lg">ניקוי</button>
                                <button onclick="con_submit()" class="px-6 py-2 bg-yellow-500 text-black font-bold rounded-lg">אישור</button>
                            </div>
                        `}
                    </div>
                `;
            }

            window.con_toggle = (w) => {
                if (selected.includes(w)) selected = selected.filter(x => x !== w);
                else if (selected.length < 4) selected.push(w);
                render();
            };
            window.con_shuffle = () => { allWords.sort(() => Math.random() - 0.5); render(); };
            window.con_clear = () => { selected = []; render(); };
            window.con_submit = () => {
                if (selected.length !== 4) return showToast('יש לבחור 4 מילים בדיוק', true);
                let maxMatch = 0;
                let matchedGroup = null;
                puzzle.groups.forEach(g => {
                    let matchCount = selected.filter(w => g.words.includes(w)).length;
                    if (matchCount > maxMatch) maxMatch = matchCount;
                    if (matchCount === 4) matchedGroup = g;
                });

                if (matchedGroup) {
                    solvedGroups.push(matchedGroup);
                    allWords = allWords.filter(w => !matchedGroup.words.includes(w.text));
                    selected = [];
                    showToast('קבוצה נכונה!');
                } else {
                    mistakes--;
                    if (maxMatch === 3) showToast('מרחק מילה אחת!', true);
                    else showToast('טעות, נסו שוב', true);
                }
                render();
            };
            render();
        }

        function initChain(container, puzzle, gameId, puzzleIndex, totalPuzzles) {
            let slots = new Array(puzzle.middle.length).fill(null);
            let slotsColors = new Array(puzzle.middle.length).fill('');
            let allSidelineWords = [...puzzle.middle.map(m => m.word), ...(puzzle.distractors || [])];
            allSidelineWords.sort(() => Math.random() - 0.5);

            let attempts = 0;
            let isWon = false;
            let isChecking = false;

            function render() {
                const midIdx = Math.ceil(allSidelineWords.length / 2);
                const leftSide = allSidelineWords.slice(0, midIdx);
                const rightSide = allSidelineWords.slice(midIdx);

                container.innerHTML = `
                    <div class="max-w-xl mx-auto space-y-6 py-4">
                        <div class="flex justify-between items-center border-b border-zinc-800 pb-2">
                            <button onclick="router.navigate('hub')" class="text-sm text-zinc-400">חזרה</button>
                            <h2 class="text-xl font-bold text-white">${puzzle.name || 'השרשרת'}</h2>
                            <div class="text-amber-400 font-bold text-sm">ניסיונות: ${attempts}/5</div>
                        </div>

                        <div class="grid grid-cols-3 items-center gap-4 bg-zinc-900 border border-zinc-800 rounded-3xl p-6">
                            <div class="flex flex-col gap-3 items-center min-h-[250px] justify-center transition-colors rounded-2xl p-2" ondragover="event.preventDefault()" ondrop="ch_drop(event, 'sideline')">
                                ${leftSide.map(w => `
                                    <div draggable="${!isChecking && !isWon}" 
                                         ondragstart="ch_dragStart(event, '${w}', 'sideline')" 
                                         onclick="!${isChecking} && !${isWon} && ch_quickPlace('${w}')" 
                                         class="w-20 h-20 rounded-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-sm flex items-center justify-center p-2 text-center shadow transition cursor-grab active:cursor-grabbing">
                                        ${w}
                                    </div>
                                `).join('')}
                            </div>

                            <div class="flex flex-col items-center space-y-2">
                                <div class="w-16 h-16 rounded-full bg-white text-black font-extrabold flex items-center justify-center text-sm border-4 border-amber-500 shadow">${puzzle.start}</div>
                                <div class="w-1 h-3 bg-zinc-700"></div>

                                ${slots.map((word, i) => {
                                    let bg = word ? 'bg-amber-500/25 border-amber-500 text-amber-100' : 'bg-zinc-800/80 border-zinc-700 text-zinc-500 border-dashed';
                                    if (slotsColors[i] === 'green') bg = 'bg-emerald-600 border-emerald-400 text-white';
                                    if (slotsColors[i] === 'red') bg = 'bg-red-600 border-red-400 text-white';
                                    if (isWon) bg = 'bg-emerald-600 border-emerald-400 text-white';
                                    return `
                                    <div draggable="${word && !isChecking && !isWon}" 
                                         ondragstart="${word && !isWon ? `ch_dragStart(event, '${word}', 'slot', ${i})` : ''}" 
                                         ondragover="event.preventDefault()" 
                                         ondrop="ch_drop(event, 'slot', ${i})" 
                                         onclick="!${isChecking} && !${isWon} && ch_remove(${i})" 
                                         class="w-16 h-16 rounded-full border-2 flex items-center justify-center font-bold text-xs transition ${bg} p-1 text-center ${word && !isWon ? 'cursor-grab active:cursor-grabbing' : 'cursor-pointer'}">
                                        ${word || `חוליה ${i+1}`}
                                    </div>
                                    <div class="w-1 h-3 bg-zinc-700"></div>
                                    `;
                                }).join('')}

                                <div class="w-16 h-16 rounded-full bg-white text-black font-extrabold flex items-center justify-center text-sm border-4 border-amber-500 shadow">${puzzle.end}</div>
                            </div>

                            <div class="flex flex-col gap-3 items-center min-h-[250px] justify-center transition-colors rounded-2xl p-2" ondragover="event.preventDefault()" ondrop="ch_drop(event, 'sideline')">
                                ${rightSide.map(w => `
                                    <div draggable="${!isChecking && !isWon}" 
                                         ondragstart="ch_dragStart(event, '${w}', 'sideline')" 
                                         onclick="!${isChecking} && !${isWon} && ch_quickPlace('${w}')" 
                                         class="w-20 h-20 rounded-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-sm flex items-center justify-center p-2 text-center shadow transition cursor-grab active:cursor-grabbing">
                                        ${w}
                                    </div>
                                `).join('')}
                            </div>
                        </div>

                        ${isWon ? `
                            <div class="p-6 bg-emerald-900/40 border border-emerald-500 rounded-xl space-y-3">
                                <h3 class="text-xl font-bold text-emerald-400 text-center">${attempts >= 5 ? 'נגמרו הניסיונות! הנה התשובה הנכונה:' : 'הצלחת! הסברים לשרשרת:'}</h3>
                                <ul class="space-y-2 text-sm text-zinc-300">
                                    ${puzzle.middle.map((m, i) => `<li><strong class="text-white">${m.word}:</strong> ${m.explanation}</li>`).join('')}
                                </ul>
                                ${renderNextPuzzleButton(gameId, puzzleIndex, totalPuzzles)}
                            </div>
                        ` : `
                            <div class="flex gap-3 justify-center">
                                <button onclick="!${isChecking} && ch_clear()" class="px-6 py-2.5 bg-zinc-800 text-white rounded-xl text-sm font-semibold">ניקוי לוח</button>
                                <button onclick="!${isChecking} && ch_check()" class="px-8 py-2.5 bg-yellow-500 hover:bg-yellow-400 text-black font-bold rounded-xl text-sm shadow">אישור</button>
                            </div>
                        `}
                    </div>
                `;
            }

            window.ch_dragStart = (e, word, source, slotIndex = null) => {
                e.dataTransfer.setData('text/plain', JSON.stringify({ word, source, slotIndex }));
            };

            window.ch_drop = (e, targetType, targetSlotIdx = null) => {
                e.preventDefault();
                if (isChecking || isWon) return;
                try {
                    const data = JSON.parse(e.dataTransfer.getData('text/plain'));
                    const word = data.word, source = data.source, prevSlotIdx = data.slotIndex;
                    if (source === 'slot' && prevSlotIdx !== null) slots[prevSlotIdx] = null;
                    else if (source === 'sideline') allSidelineWords = allSidelineWords.filter(x => x !== word);

                    if (targetType === 'slot' && targetSlotIdx !== null) {
                        if (slots[targetSlotIdx]) allSidelineWords.push(slots[targetSlotIdx]);
                        slots[targetSlotIdx] = word;
                    } else if (targetType === 'sideline') {
                        allSidelineWords.push(word);
                    }
                    render();
                } catch (err) {}
            };

            window.ch_quickPlace = (w) => {
                if (isWon) return;
                const idx = slots.indexOf(null);
                if (idx > -1) { slots[idx] = w; allSidelineWords = allSidelineWords.filter(x => x !== w); render(); }
            };

            window.ch_remove = (idx) => {
                if (isWon) return;
                if (slots[idx]) { allSidelineWords.push(slots[idx]); slots[idx] = null; render(); }
            };

            window.ch_clear = () => { 
                if (isWon) return;
                allSidelineWords.push(...slots.filter(Boolean)); slots.fill(null); render(); 
            };

            window.ch_check = () => {
                if (slots.includes(null)) return showToast('מלא את כל החוליות בשרשרת', true);
                attempts++;
                isChecking = true;
                let correctCount = 0;
                slots.forEach((w, i) => {
                    if (w === puzzle.middle[i].word) { slotsColors[i] = 'green'; correctCount++; }
                    else slotsColors[i] = 'red';
                });
                render();

                setTimeout(() => {
                    if (correctCount === puzzle.middle.length) isWon = true;
                    else if (attempts >= 5) {
                        slots = puzzle.middle.map(m => m.word);
                        allSidelineWords = [];
                        isWon = true;
                    } else {
                        slots.forEach((w, i) => {
                            if (slotsColors[i] === 'red') { allSidelineWords.push(w); slots[i] = null; }
                        });
                        showToast('חלק מהחוליות שגויות', true);
                    }
                    slotsColors.fill('');
                    isChecking = false;
                    render();
                }, 1200);
            };
            render();
        }

        function initWordle(container, puzzle, gameId, puzzleIndex, totalPuzzles) {
            const target = puzzle.word.trim();
            let guesses = [];
            let current = "";
            let over = false;
            let won = false;
            
            const finalMap = { 'כ': 'ך', 'מ': 'ם', 'נ': 'ן', 'פ': 'ף', 'צ': 'ץ' };
            const baseMap = { 'ך': 'כ', 'ם': 'מ', 'ן': 'נ', 'ף': 'פ', 'ץ': 'צ' };
            const kbRows = [['פ','ו','ט','א','ר','ק'], ['ל','ח','י','ע','כ','ג','ד','ש'], ['ת','צ','מ','נ','ה','ב','ס','ז']];

            function render() {
                container.innerHTML = `
                    <div class="max-w-md mx-auto space-y-4 py-4">
                        <div class="flex justify-between items-center border-b border-zinc-800 pb-2">
                            <button onclick="router.navigate('hub')" class="text-sm text-zinc-400">חזרה</button>
                            <h2 class="text-xl font-bold text-white">וורדל</h2>
                            <div class="text-amber-400 text-xs">${puzzle.clue}</div>
                        </div>

                        <div class="grid grid-rows-6 gap-2 w-max mx-auto" dir="rtl">
                            ${Array.from({length: 6}, (_, r) => {
                                const g = guesses[r] || (r === guesses.length && !over ? current : "");
                                return `<div class="grid grid-cols-6 gap-2">
                                    ${Array.from({length: 6}, (_, c) => {
                                        let char = g[c] || "";
                                        if (c === 5 && char && finalMap[char]) char = finalMap[char];
                                        let bg = "bg-zinc-900 border-zinc-700 text-white";
                                        if (r < guesses.length) {
                                            const tChar = baseMap[target[c]] || target[c];
                                            const gChar = baseMap[g[c]] || g[c];
                                            if (tChar === gChar) bg = "bg-emerald-600 border-emerald-500 text-white";
                                            else if (target.includes(gChar)) bg = "bg-amber-600 border-amber-500 text-white";
                                            else bg = "bg-zinc-800 border-zinc-800 text-zinc-500";
                                        }
                                        return `<div class="w-10 h-10 sm:w-12 sm:h-12 border-2 rounded flex items-center justify-center font-bold text-xl ${bg}">${char}</div>`;
                                    }).join('')}
                                </div>`;
                            }).join('')}
                        </div>

                        ${over ? `
                            <div class="p-4 rounded-xl text-center ${won ? 'bg-emerald-900/40 text-emerald-400' : 'bg-red-900/40 text-red-400'}">
                                <h3 class="font-bold text-xl mb-2">${won ? 'כל הכבוד!' : `הפסדת! המילה: ${target}`}</h3>
                                ${renderNextPuzzleButton(gameId, puzzleIndex, totalPuzzles)}
                            </div>
                        ` : `
                            <div class="space-y-2 pt-4">
                                ${kbRows.map(row => `
                                    <div class="flex justify-center gap-1 sm:gap-2">
                                        ${row.map(k => `<button onclick="w_key('${k}')" class="px-3 sm:px-4 py-3 bg-zinc-800 text-white font-bold rounded-lg text-lg shadow active:bg-zinc-600 transition">${k}</button>`).join('')}
                                    </div>
                                `).join('')}
                                <div class="flex justify-center gap-2 mt-2">
                                    <button onclick="w_key('ENTER')" class="px-6 py-3 bg-yellow-500 text-black font-bold rounded-lg text-sm shadow">אישור</button>
                                    <button onclick="w_key('BACK')" class="px-6 py-3 bg-zinc-700 text-white font-bold rounded-lg text-sm shadow">מחק</button>
                                </div>
                            </div>
                        `}
                    </div>
                `;
            }

            window.w_key = (k) => {
                if (over) return;
                if (k === 'BACK') current = current.slice(0, -1);
                else if (k === 'ENTER') {
                    if (current.length !== 6) return showToast('נדרשות 6 אותיות בדיוק', true);
                    guesses.push(current);
                    if (current === target) { over = true; won = true; }
                    else if (guesses.length === 6) over = true;
                    current = "";
                } else if (current.length < 6) current += k;
                render();
            };
            render();
        }

        function init20Questions(container, puzzle, gameId, puzzleIndex, totalPuzzles) {
            let items = puzzle.items || [];
            let curr = 0;
            let states = new Array(items.length).fill(null);
            let show = false;
            let finished = false;

            function render() {
                if (finished) {
                    const score = states.filter(s => s === 'V').length;
                    container.innerHTML = `<div class="max-w-lg mx-auto py-10 text-center space-y-6"><h2 class="text-3xl font-bold">סיכום שאלון</h2><div class="text-5xl font-black text-amber-400">${score}/${items.length}</div>${renderNextPuzzleButton(gameId, puzzleIndex, totalPuzzles)}</div>`;
                    return;
                }
                const q = items[curr];
                container.innerHTML = `
                    <div class="max-w-lg mx-auto space-y-6 py-4">
                        <div class="flex justify-between items-center border-b border-zinc-800 pb-2">
                            <button onclick="router.navigate('hub')" class="text-sm text-zinc-400">חזרה</button>
                            <h2 class="text-xl font-bold text-white">${puzzle.title}</h2>
                            <div class="text-amber-400 text-sm">${curr+1}/${items.length}</div>
                        </div>
                        <div class="bg-zinc-900 border border-zinc-800 rounded-3xl p-8 space-y-6 text-center">
                            <h3 class="text-2xl font-bold text-white">${q.q}</h3>
                            ${!show ? `
                                <button onclick="q_show()" class="px-6 py-3 bg-yellow-500 text-black font-bold rounded-xl mt-6">הצג תשובה</button>
                            ` : `
                                <div class="p-4 bg-blue-900/30 text-blue-200 rounded-xl text-lg">${q.a}</div>
                                <div class="flex gap-4 justify-center pt-4 border-t border-zinc-800">
                                    <button onclick="q_ans('V')" class="px-8 py-3 bg-emerald-600 text-white font-bold rounded-xl text-xl">✅ נכון</button>
                                    <button onclick="q_ans('X')" class="px-8 py-3 bg-red-600 text-white font-bold rounded-xl text-xl">❌ טעות</button>
                                </div>
                            `}
                        </div>
                    </div>
                `;
            }
            window.q_show = () => { show = true; render(); };
            window.q_ans = (v) => {
                states[curr] = v;
                if (curr < items.length - 1) { curr++; show = false; }
                else finished = true;
                render();
            };
            render();
        }

        function initLogicRiddle(container, puzzle, gameId, puzzleIndex, totalPuzzles) {
            const ans = puzzle.answer.trim();
            const len = ans.length;
            let input = new Array(len).fill("");
            let mistakes = 0;
            let hints = 0;
            let over = false;
            let won = false;
            const kbRows = [['פ','ו','ט','א','ר','ק'], ['ל','ח','י','ע','כ','ג','ד','ש'], ['ת','צ','מ','נ','ה','ב','ס','ז']];

            function render() {
                container.innerHTML = `
                    <div class="max-w-md mx-auto space-y-6 py-4">
                        <div class="flex justify-between items-center border-b border-zinc-800 pb-2">
                            <button onclick="router.navigate('hub')" class="text-sm text-zinc-400">חזרה</button>
                            <h2 class="text-xl font-bold text-white">הגיונית</h2>
                            <div class="text-amber-400 text-sm">ניסיונות: ${3-mistakes}</div>
                        </div>
                        <div class="bg-zinc-900 p-6 rounded-2xl text-center border border-zinc-800 shadow-lg">
                            <div class="text-xs text-zinc-500 mb-2">${puzzle.date}</div>
                            <h3 class="text-xl font-bold text-white">${puzzle.riddle}</h3>
                        </div>
                        <div class="flex justify-center gap-2" dir="rtl">
                            ${Array.from({length: len}, (_, i) => `<div class="w-10 h-12 border-b-4 ${input[i] ? 'border-amber-500' : 'border-zinc-700'} flex items-center justify-center font-bold text-2xl text-white">${input[i]}</div>`).join('')}
                        </div>
                        
                        ${over ? `
                            <div class="p-6 text-center rounded-2xl ${won ? 'bg-emerald-900/40' : 'bg-red-900/40'}">
                                <h3 class="text-xl font-bold text-white mb-4">${won ? 'מצוין!' : `הפסדת. התשובה: ${ans}`}</h3>
                                ${renderNextPuzzleButton(gameId, puzzleIndex, totalPuzzles)}
                            </div>
                        ` : `
                            <div class="flex gap-2 justify-center">
                                <button onclick="r_hint()" class="px-4 py-2 bg-indigo-900/50 text-indigo-300 rounded-lg text-sm border border-indigo-500/30">רמז (${2-hints})</button>
                                <button onclick="r_check()" class="px-6 py-2 bg-yellow-500 text-black font-bold rounded-lg text-sm shadow">אישור ניחוש</button>
                            </div>
                            <div class="space-y-2 pt-2">
                                ${kbRows.map(row => `
                                    <div class="flex justify-center gap-1 sm:gap-2">
                                        ${row.map(k => `<button onclick="r_key('${k}')" class="px-3 sm:px-4 py-3 bg-zinc-800 text-white font-bold rounded-lg text-lg shadow active:bg-zinc-600 transition">${k}</button>`).join('')}
                                    </div>
                                `).join('')}
                                <div class="flex justify-center mt-2">
                                    <button onclick="r_key('BACK')" class="px-10 py-3 bg-zinc-700 text-white font-bold rounded-lg text-sm shadow">מחיקה</button>
                                </div>
                            </div>
                        `}
                    </div>
                `;
            }

            window.r_key = (k) => {
                if(over) return;
                if(k === 'BACK') {
                    for(let i=len-1; i>=0; i--) if(input[i] && (hints === 0 || i >= hints)) { input[i] = ""; break; }
                } else {
                    const idx = input.indexOf("");
                    if (idx > -1) input[idx] = k;
                }
                render();
            };
            window.r_hint = () => {
                if (hints >= 2) return showToast('אין יותר רמזים', true);
                input[hints] = ans[hints];
                hints++;
                render();
            };
            window.r_check = () => {
                if(input.includes("")) return showToast('מלאו את כל התיבות', true);
                const guess = input.join('');
                if (guess === ans) { over = true; won = true; }
                else {
                    mistakes++;
                    if (mistakes >= 3) { over = true; won = false; }
                    else {
                        for(let i=0; i<len; i++) if(input[i] !== ans[i]) input[i] = ""; 
                        showToast('טעות! אותיות שגויות נמחקו', true);
                    }
                }
                render();
            };
            render();
        }

            if (steps.length === 0) steps = ["https://placehold.co/400x400/1e1e1e/eab308?text=No+Image"];
            let curr = 0;
            let val = "";
            let over = false;
            let won = false;

            function render() {
                container.innerHTML = `

                            ${over ? `

                                    <p class="text-white text-lg">התשובה: ${puzzle.answer}</p>${renderNextPuzzleButton(gameId, puzzleIndex, totalPuzzles)}
                                </div>
                            ` : `

                                <div class="flex gap-2 w-full">
                                    <input type="text" id="p-guess" value="${val}" placeholder="מי בתמונה?" class="flex-1 bg-zinc-800 border-zinc-700 rounded-xl px-4 text-white focus:outline-none">
                                    <button onclick="p_check()" class="px-6 py-3 bg-zinc-700 text-white font-bold rounded-xl">אישור</button>
                                </div>
                            `}
                        </div>
                    </div>
                `;
            }

            window.p_next = () => {
                if (curr < steps.length - 1) { curr++; showToast('עובר לשלב הבא'); }
                else { over = true; won = false; showToast('אין יותר רזולוציות!', true); }
                render();
            };
            window.p_check = () => {
                const el = document.getElementById('p-guess');
                val = el ? el.value.trim() : "";
                if(!val) return;
                if(val === puzzle.answer) { over = true; won = true; }
                else {
                    if (curr < steps.length - 1) { curr++; showToast('טעות, התקדמת שלב', true); val = ""; }
                    else { over = true; won = false; showToast('טעות! המשחק נגמר', true); }
                }
                render();
            };
            render();
        }

                                    <div class="flex items-center gap-3">
                                        <span class="text-3xl">${g.icon}</span>
                                        <span class="font-bold text-white text-base">${g.title}</span>
                                    </div>
                                    <span class="text-zinc-500">←</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        window.adm_saveConfig = () => {
            const config = {
                owner: document.getElementById('gh_owner').value.trim(),
                repo: document.getElementById('gh_repo').value.trim(),
                branch: document.getElementById('gh_branch').value.trim() || 'main',
                path: document.getElementById('gh_path').value.trim() || 'puzzles.json',
                token: document.getElementById('gh_token').value.trim()
            };
            saveGitHubConfig(config);
            showToast('הגדרות GitHub נשמרו בהצלחה!');
        };

        window.adm_pullGithub = async () => {
            try {
                showToast('מוריד נתונים מ-GitHub...');
                await syncFetchFromGitHub();
                showToast('הנתונים עודכנו מהענן בהצלחה!');
                router.navigate('adminHub');
            } catch (err) {
                showToast(err.message || 'שגיאה במשיכת נתונים', true);
            }
        };

        window.adm_pushGithub = async () => {
            try {
                showToast('מעלה נתונים ל-GitHub...');
                const data = getAppData();
                await syncPushToGitHub(data, 'Manual sync from Admin Hub');
                showToast('הנתונים הועלו בהצלחה לענן!');
            } catch (err) {
                showToast(err.message || 'שגיאה בשמירה לענן', true);
            }
        };

        function renderAdminGame(container, gameId) {
            const data = getAppData();
            const gameData = data[gameId];

            container.innerHTML = `
                <div class="max-w-3xl mx-auto space-y-6 py-6">
                    <div class="flex justify-between items-center border-b border-zinc-800 pb-4">
                        <button onclick="router.navigate('adminHub')" class="text-zinc-400 hover:text-white">← חזרה לפאנל ניהול</button>
                        <h2 class="text-2xl font-black text-white">${gameData.title}</h2>
                        <button onclick="router.navigate('adminForm', {gameId: '${gameId}', puzzleIndex: -1})" class="px-4 py-2 bg-yellow-500 hover:bg-yellow-400 text-black font-bold rounded-xl text-sm transition">➕ הוסף חידה חדשה</button>
                    </div>
                    <div class="space-y-3">
                        ${gameData.puzzles.length === 0 ? `<div class="text-zinc-500 text-center py-10">אין חידות. הוסף אחת!</div>` : ''}
                        ${gameData.puzzles.map((p, idx) => `
                            <div class="bg-zinc-900 border border-zinc-800 rounded-xl p-4 flex items-center justify-between">
                                <div>
                                    <h4 class="font-bold text-white">חידה #${idx + 1}</h4>
                                    <p class="text-xs text-zinc-400 mt-0.5">${p.name || p.answer || p.word || p.title || p.riddle || ''}</p>
                                </div>
                                <div class="flex gap-2">
                                    <button onclick="router.navigate('adminForm', {gameId: '${gameId}', puzzleIndex:${idx}})" class="px-4 py-2 bg-zinc-800 hover:bg-zinc-700 text-white rounded-lg text-sm transition">עריכה</button>
                                    <button onclick="adm_del('${gameId}',${idx})" class="px-4 py-2 bg-red-900/40 hover:bg-red-900/60 text-red-300 rounded-lg text-sm transition">מחיקה</button>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        window.adm_del = (gId, idx) => {
            const data = getAppData();
            data[gId].puzzles.splice(idx, 1);
            saveAppData(data);
            showToast('החידה נמחקה בהצלחה');
            renderAdminGame(document.getElementById('app'), gId);
        };

        function renderAdminForm(container, gameId, puzzleIndex) {
            const data = getAppData();
            const isNew = puzzleIndex === -1;
            let p = isNew ? {} : JSON.parse(JSON.stringify(data[gameId].puzzles[puzzleIndex]));

            if (isNew) {
                p.id = Date.now();
                if (gameId === 'connections') p = { ...p, name: "חידה חדשה", groups: Array(4).fill({category: "", words: ["","","",""]}) };
                if (gameId === 'chain') p = { ...p, name: "שרשרת חדשה", start: "", end: "", middle: [{word: "", explanation: ""}], distractors: [""] };
                if (gameId === 'wordle') p = { ...p, word: "", clue: "" };
                if (gameId === 'questions20') p = { ...p, title: "שאלון חדש", items: [{q: "", a: ""}] };
                if (gameId === 'logicRiddle') p = { ...p, riddle: "", answer: "", date: "" };
                if (gameId === 'progressiveImage') p = { ...p, answer: "", steps: Array(6).fill("") };
            }

            let formHtml = '';

            if (gameId === 'connections') {
                formHtml = `
                    <input type="text" id="f_name" value="${p.name || ''}" class="w-full p-2.5 bg-zinc-800 text-white rounded-xl border border-zinc-700 mb-4" placeholder="שם החידה">
                    ${p.groups.map((g, i) => `
                        <div class="border border-zinc-700 p-4 rounded-xl space-y-2 mt-4 bg-zinc-900/50">
                            <label class="text-sm font-bold text-amber-400">קבוצה ${i+1}</label>
                            <input type="text" id="f_cat_${i}" value="${g.category}" class="w-full p-2 bg-zinc-800 text-white rounded-lg border border-zinc-700" placeholder="שם הקטגוריה">
                            <div class="grid grid-cols-2 gap-2">
                                ${g.words.map((w, wi) => `<input type="text" id="f_w_${i}_${wi}" value="${w}" class="w-full p-2 bg-zinc-800 text-white rounded-lg border border-zinc-700" placeholder="מילה ${wi+1}">`).join('')}
                            </div>
                        </div>
                    `).join('')}
                `;
            } else if (gameId === 'chain') {
                formHtml = `
                    <input type="text" id="f_c_name" value="${p.name || ''}" class="w-full p-2.5 bg-zinc-800 text-white rounded-xl border border-zinc-700 mb-4" placeholder="שם השרשרת">
                    <div class="grid grid-cols-2 gap-4 mb-4">
                        <div><label class="text-xs text-zinc-400">מילת התחלה</label><input type="text" id="f_c_start" value="${p.start || ''}" class="w-full p-2.5 bg-zinc-800 text-white rounded-xl border border-zinc-700"></div>
                        <div><label class="text-xs text-zinc-400">מילת סיום</label><input type="text" id="f_c_end" value="${p.end || ''}" class="w-full p-2.5 bg-zinc-800 text-white rounded-xl border border-zinc-700"></div>
                    </div>
                    <label class="font-bold text-amber-400 block mb-2">חוליות נכונות בסדר עולה:</label>
                    <div id="chain-middle-container" class="space-y-3">
                        ${p.middle.map((m, i) => `
                            <div class="flex gap-2 items-center bg-zinc-900 p-3 rounded-xl border border-zinc-700">
                                <input type="text" placeholder="מילה" class="f_m_word w-1/3 p-2 bg-zinc-800 text-white rounded-lg border border-zinc-700" value="${m.word}">
                                <input type="text" placeholder="הסבר" class="f_m_exp flex-1 p-2 bg-zinc-800 text-white rounded-lg border border-zinc-700" value="${m.explanation}">
                            </div>
                        `).join('')}
                    </div>
                    <button type="button" onclick="addChainMiddleField()" class="mt-3 px-3 py-1.5 bg-zinc-800 hover:bg-zinc-700 text-xs font-semibold rounded-lg text-amber-400">+ הוסף חוליה</button>
                    
                    <div class="mt-6">
                        <label class="font-bold text-amber-400 block mb-2">מסיחים (מילים שגויות לצדדים):</label>
                        <input type="text" id="f_c_distractors" value="${(p.distractors || []).join(', ')}" class="w-full p-2.5 bg-zinc-800 text-white rounded-xl border border-zinc-700" placeholder="הפרד בפסיקים, למשל: סמי, סרט">
                    </div>
                `;
            } else if (gameId === 'wordle') {
                formHtml = `
                    <label class="block text-sm font-bold mb-1">מילה (6 אותיות)</label>
                    <input type="text" id="f_w" value="${p.word}" class="w-full p-3 bg-zinc-800 text-white rounded-xl border border-zinc-700 mb-4" placeholder="דוגמה: מחשבה">
                    <label class="block text-sm font-bold mb-1">רמז</label>
                    <input type="text" id="f_c" value="${p.clue}" class="w-full p-3 bg-zinc-800 text-white rounded-xl border border-zinc-700" placeholder="רמז למילה">
                `;
            } else if (gameId === 'questions20') {
                formHtml = `
                    <input type="text" id="f_20_title" value="${p.title || ''}" class="w-full p-2.5 bg-zinc-800 text-white rounded-xl border border-zinc-700 mb-4" placeholder="כותרת השאלון">
                    <div id="questions-items-container" class="space-y-3">
                        ${(p.items || []).map((item, i) => `
                            <div class="flex gap-2 items-center bg-zinc-900 p-3 rounded-xl border border-zinc-700">
                                <span class="font-bold text-xs text-amber-400">${i+1}</span>
                                <input type="text" placeholder="שאלה" class="q_item_q flex-1 p-2 bg-zinc-800 text-white rounded-lg border border-zinc-700" value="${item.q}">
                                <input type="text" placeholder="תשובה" class="q_item_a w-1/3 p-2 bg-zinc-800 text-white rounded-lg border border-zinc-700" value="${item.a}">
                            </div>
                        `).join('')}
                    </div>
                    <button type="button" onclick="add20QuestionField()" class="mt-3 px-3 py-1.5 bg-zinc-800 hover:bg-zinc-700 text-xs font-semibold rounded-lg text-amber-400">+ הוסף שאלה</button>
                `;
            } else if (gameId === 'logicRiddle') {
                formHtml = `
                    <label class="block text-sm font-bold mb-1">חידה</label>
                    <input type="text" id="f_r" value="${p.riddle}" class="w-full p-3 bg-zinc-800 text-white rounded-xl border border-zinc-700 mb-4" placeholder="טקסט החידה">
                    <label class="block text-sm font-bold mb-1">תשובה (מילה אחת)</label>
                    <input type="text" id="f_a" value="${p.answer}" class="w-full p-3 bg-zinc-800 text-white rounded-xl border border-zinc-700 mb-4">
                    <label class="block text-sm font-bold mb-1">תאריך/כותרת משנה</label>
                    <input type="text" id="f_d" value="${p.date}" class="w-full p-3 bg-zinc-800 text-white rounded-xl border border-zinc-700">
                `;
            } else if (gameId === 'progressiveImage') {
                formHtml = `
                    <label class="block text-sm font-bold mb-1">התשובה (מי הדמות?)</label>
                    <input type="text" id="f_ans" value="${p.answer}" class="w-full p-3 bg-zinc-800 text-white rounded-xl border border-zinc-700 mb-4">
                    <p class="text-sm text-zinc-400 mb-2">ניהול 6 רזולוציות התמונה (נשמרות מקומית וניתנות לדחיפה אוטומטית לנתיבי GitHub קבועים).</p>
                    <div class="space-y-3" id="img-uploads-container">
                        ${Array.from({length: 6}, (_, i) => `
                            <div class="flex items-center gap-4 bg-zinc-900 p-3 rounded-xl border border-zinc-700">
                                <div class="font-bold w-16 text-center text-amber-400">שלב ${i+1}</div>
                                <input type="file" accept="image/*" onchange="handleImgFile(this, ${i})" class="text-sm text-zinc-400 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:bg-zinc-800 file:text-white">
                                <img id="preview_${i}" src="${p.steps && p.steps[i] ? p.steps[i] : ''}" class="w-10 h-10 object-cover rounded-lg bg-zinc-950 ${p.steps && p.steps[i] ? '' : 'hidden'}">
                                <input type="hidden" id="f_img_${i}" value="${p.steps && p.steps[i] ? p.steps[i] : ''}">
                            </div>
                        `).join('')}
                    </div>
                `;
            }

            container.innerHTML = `
                <div class="max-w-2xl mx-auto space-y-6 py-6">
                    <div class="flex justify-between items-center border-b border-zinc-800 pb-4">
                        <button onclick="router.navigate('adminGame', {gameId: '${gameId}'})" class="text-zinc-400 hover:text-white">← ביטול</button>
                        <h2 class="text-2xl font-black text-white">${isNew ? 'הוספת חידה חדשה' : 'עריכת חידה'}</h2>
                        <button onclick="saveAdminForm('${gameId}', ${puzzleIndex})" class="px-6 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl shadow-lg transition">שמור שינויים</button>
                    </div>
                    <div class="bg-zinc-900/40 p-5 sm:p-6 rounded-2xl border border-zinc-800">
                        ${formHtml}
                    </div>
                </div>
            `;
        }

        window.addChainMiddleField = () => {
            const container = document.getElementById('chain-middle-container');
            const div = document.createElement('div');
            div.className = "flex gap-2 items-center bg-zinc-900 p-3 rounded-xl border border-zinc-700";
            div.innerHTML = `<input type="text" placeholder="מילה" class="f_m_word w-1/3 p-2 bg-zinc-800 text-white rounded-lg border border-zinc-700"><input type="text" placeholder="הסבר" class="f_m_exp flex-1 p-2 bg-zinc-800 text-white rounded-lg border border-zinc-700">`;
            container.appendChild(div);
        };

        window.add20QuestionField = () => {
            const container = document.getElementById('questions-items-container');
            const count = container.children.length + 1;
            const div = document.createElement('div');
            div.className = "flex gap-2 items-center bg-zinc-900 p-3 rounded-xl border border-zinc-700";
            div.innerHTML = `<span class="font-bold text-xs text-amber-400">${count}</span><input type="text" placeholder="שאלה" class="q_item_q flex-1 p-2 bg-zinc-800 text-white rounded-lg border border-zinc-700"><input type="text" placeholder="תשובה" class="q_item_a w-1/3 p-2 bg-zinc-800 text-white rounded-lg border border-zinc-700">`;
            container.appendChild(div);
        };

        window.handleImgFile = async (input, index) => {
            const file = input.files[0];
            if (!file) return;
            const b64 = await fileToBase64(file);
            document.getElementById(`f_img_${index}`).value = b64;
            const preview = document.getElementById(`preview_${index}`);
            preview.src = b64;
            preview.classList.remove('hidden');
            
            // Optional GitHub Auto-Sync for Progressive Images using fixed static paths
            const cfg = getGitHubConfig();
            if (cfg.token && cfg.owner && cfg.repo) {
                try {
                    showToast(`מעלה תמונה ${index+1} ל-GitHub...`);
                    const remoteImagePath = `assets/progressive_${index + 1}.jpg`;
                    await uploadImageToGitHub(b64, remoteImagePath, `Update progressive image step ${index + 1}`);
                    showToast(`תמונה ${index+1} הועלתה בהצלחה לנתיב הענן!`);
                } catch (err) {
                    showToast('שגיאה בהעלאת התמונה לענן', true);
                }
            } else {
                showToast(`תמונה ${index+1} נטענה מקומית בהצלחה`);
            }
        };

        window.saveAdminForm = async (gameId, puzzleIndex) => {
            const data = getAppData();
            const isNew = puzzleIndex === -1;
            let p = isNew ? { id: Date.now() } : data[gameId].puzzles[puzzleIndex];

            try {
                if (gameId === 'connections') {
                    p.name = document.getElementById('f_name').value || "חידה";
                    p.groups = [];
                    for(let i=0; i<4; i++) {
                        let cat = document.getElementById(`f_cat_${i}`).value;
                        let words = [];
                        for(let wi=0; wi<4; wi++) words.push(document.getElementById(`f_w_${i}_${wi}`).value.trim());
                        p.groups.push({ category: cat, words: words });
                    }
                } else if (gameId === 'chain') {
                    p.name = document.getElementById('f_c_name').value || "שרשרת";
                    p.start = document.getElementById('f_c_start').value.trim();
                    p.end = document.getElementById('f_c_end').value.trim();
                    p.middle = [];
                    document.querySelectorAll('#chain-middle-container > div').forEach(row => {
                        const word = row.querySelector('.f_m_word').value.trim();
                        const explanation = row.querySelector('.f_m_exp').value.trim();
                        if(word) p.middle.push({ word, explanation });
                    });
                    const distStr = document.getElementById('f_c_distractors').value;
                    p.distractors = distStr ? distStr.split(',').map(s => s.trim()).filter(Boolean) : [];
                } else if (gameId === 'wordle') {
                    p.word = document.getElementById('f_w').value.trim();
                    p.clue = document.getElementById('f_c').value.trim();
                    if(p.word.length !== 6) return showToast('שגיאה: המילה חייבת להיות 6 אותיות!', true);
                } else if (gameId === 'questions20') {
                    p.title = document.getElementById('f_20_title').value || "שאלון";
                    p.items = [];
                    document.querySelectorAll('#questions-items-container > div').forEach(row => {
                        const q = row.querySelector('.q_item_q').value.trim();
                        const a = row.querySelector('.q_item_a').value.trim();
                        if(q && a) p.items.push({ q, a });
                    });
                } else if (gameId === 'logicRiddle') {
                    p.riddle = document.getElementById('f_r').value;
                    p.answer = document.getElementById('f_a').value.trim();
                    p.date = document.getElementById('f_d').value;
                } else if (gameId === 'progressiveImage') {
                    p.answer = document.getElementById('f_ans').value;
                    p.steps = [];
                    for(let i=0; i<6; i++) p.steps.push(document.getElementById(`f_img_${i}`).value);
                }

                if (isNew) data[gameId].puzzles.push(p);
                else data[gameId].puzzles[puzzleIndex] = p;

                saveAppData(data);

                // Attempt auto-push to GitHub if configured
                const cfg = getGitHubConfig();
                if (cfg.token && cfg.owner && cfg.repo) {
                    try {
                        showToast('שומר ומסנכרן מול GitHub...');
                        await syncPushToGitHub(data, `Update puzzle item in ${gameId}`);
                        showToast('נשמר וסונכרן לענן בהצלחה!');
                    } catch (e) {
                        showToast('נשמר מקומית (שגיאה בסנכרון ענן)', true);
                    }
                } else {
                    showToast('נשמר מקומית בהצלחה!');
                }

                router.navigate('adminGame', {gameId});
            } catch (err) {
                showToast('שגיאה בשמירה. בדוק את הנתונים.', true);
                console.error(err);
            }
        };

        window.onload = () => router.navigate('hub');
    </script>
</body>
</html>
