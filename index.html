<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&family=Heebo:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Assistant', 'Heebo', sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            overflow-x: hidden;
        }

        ::-webkit-scrollbar-thumb:hover { background: #52525b; }

        @keyframes slideInDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeOut { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-10px); } }

</head>
<body class="min-h-screen flex flex-col selection:bg-yellow-500 selection:text-black">

            <div class="flex items-center gap-2">

        <p>פורטל משחקים עברי מתקדם • מסונכרן אוטומטית</p>
        <button onclick="tryAdminAccess()" class="text-zinc-600 hover:text-zinc-400 transition text-[10px]">⚙️ כניסת מנהל</button>
    </footer>

                code: 210

        const DEFAULT_DATA = {

                        { category: "גבינות קשות", words: ["פרמזן", "קשקבל", "גרוייר", "פקורינו"] },

                        { category: "צבעי יסוד", words: ["אדום", "כחול", "צהוב", "ירוק"] }
                    ] 
                }] 
            },
            chain: {

                puzzles: [{ 
                    id: 1, 
                    name: "שרשרת ראשונה", 
                    start: "נע", 
                    end: "במבי", 
                    middle: [
                        { word: "הכבאי", explanation: "נע ודן, דן הכבאי" }, 
                        { word: "ונד", explanation: "סם הכבאי, סם ונד" },

                    { id: 2, word: "משחקים", clue: "מה שאנחנו עושים עכשיו" }

                        { q: "מהו ההר הגבוה ביותר בעולם?", a: "אוורסט" },
                        { q: "באיזו שנה הוקמה מדינת ישראל?", a: "1948" },
                        { q: "כמה ימים יש בשנה מעוברת?", a: "366" }
                    ] 
                }] 
            },
            logicRiddle: { 
                title: "הגיונית", 
                puzzles: [
                    { id: 1, riddle: "הם טסים והוא מממש את ייעודו", answer: "מטוס", date: "28.09.2026" }, 
                    { id: 2, riddle: "עיר בירה ללא ים", answer: "ירושלים", date: "29.09.2026" }
                ] 
            },
            progressiveImage: { 
                title: "מי אני?", 
                puzzles: [{ 
                    id: 1, 
                    answer: "אלברט איינשטיין", 
                    steps: Array(6).fill("https://placehold.co/400x400/1e1e1e/eab308?text=Step") 
                }] 
            }
        };

        let cachedAppData = null;
        window.currentIsAdmin = false;

        function getGithubToken() {
            return localStorage.getItem('hebrew_portal_gh_token') || '';
        }

        async function fetchRemoteData() {
            try {
                const res = await fetch(`https://raw.githubusercontent.com/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/${GITHUB_CONFIG.branch}/${GITHUB_CONFIG.path}?t=${Date.now()}`);
                if (res.ok) {
                    const remoteData = await res.json();
                    cachedAppData = remoteData;
                    localStorage.setItem('hebrew_game_portal_v3', JSON.stringify(remoteData));
                    return remoteData;
                }
            } catch (e) {}
            return null;
        }

        function getAppData() {
            if (cachedAppData) return cachedAppData;
            try {
                const saved = localStorage.getItem('hebrew_game_portal_v3');
                if (saved) {
                    cachedAppData = JSON.parse(saved);
                    return cachedAppData;
                }
            } catch (e) {}
            cachedAppData = DEFAULT_DATA;
            return DEFAULT_DATA;
        }

        async function saveAppData(data) {
            cachedAppData = data;
            localStorage.setItem('hebrew_game_portal_v3', JSON.stringify(data));
            
            const token = getGithubToken();
            if (!token) return;

            try {
                showToast("מעדכן נתונים ב-GitHub...");
                const apiUrl = `https://api.github.com/repos/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/contents/${GITHUB_CONFIG.path}`;
                
                const getRes = await fetch(apiUrl, {
                    headers: { 'Authorization': `Bearer ${token}`, 'Accept': 'vnd.github+json', 'Cache-Control': 'no-cache' }
                });
                let sha = null;
                if (getRes.ok) {
                    const fileData = await getRes.json();
                    sha = fileData.sha;
                }

                const jsonString = JSON.stringify(data, null, 2);
                const base64Content = btoa(unescape(encodeURIComponent(jsonString)));

                const putRes = await fetch(apiUrl, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Accept': 'vnd.github+json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: "Update games data via Hebrew Portal",
                        content: base64Content,
                        sha: sha,
                        branch: GITHUB_CONFIG.branch
                    })
                });

                if (putRes.ok) {
                    showToast("הנתונים סונכרנו בהצלחה עם GitHub!");
                } else {
                    showToast("שגיאה בסנכרון מול GitHub", true);
                }
            } catch (err) {
                console.error(err);
            }
        }

        async function uploadImageToGitHub(path, base64Data) {
            const token = getGithubToken();
            if (!token) throw new Error("יש להגדיר קוד גישה (PAT) של GitHub בהגדרות המנהל");

            const apiUrl = `https://api.github.com/repos/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/contents/${path}`;
            let sha = null;
            const getRes = await fetch(apiUrl, {
                headers: { 'Authorization': `Bearer ${token}`, 'Accept': 'vnd.github+json', 'Cache-Control': 'no-cache' }
            });
            if (getRes.ok) {
                const fileData = await getRes.json();
                sha = fileData.sha;
            }

            const base64Clean = base64Data.split(',')[1] || base64Data;
            const putRes = await fetch(apiUrl, {
                method: 'PUT',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Accept': 'vnd.github+json',
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    message: `Upload progressive image ${path}`,
                    content: base64Clean,
                    sha: sha,
                    branch: GITHUB_CONFIG.branch
                })
            });

            if (!putRes.ok) throw new Error("שגיאה בהעלאת התמונה ל-GitHub");
            return `https://raw.githubusercontent.com/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/${GITHUB_CONFIG.branch}/${path}`;
        }

        function showToast(msg, isError = false) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast-enter p-3 rounded-xl text-center font-bold text-sm shadow-xl ${isError ? 'bg-red-600 text-white' : 'bg-yellow-500 text-black'}`;
            toast.innerText = msg;
            container.appendChild(toast);
            setTimeout(() => {
                toast.classList.replace('toast-enter', 'toast-leave');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        async function fileToBase64(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX = 400;
                        let w = img.width, h = img.height;
                        if (w > MAX || h > MAX) {
                            if (w > h) { h *= MAX / w; w = MAX; } else { w *= MAX / h; h = MAX; }
                        }
                        canvas.width = w; canvas.height = h;
                        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                        resolve(canvas.toDataURL('image/jpeg', 0.7));
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        function tryAdminAccess() {
            const pwd = prompt("הכנס סיסמת מנהל:");
            if (pwd === "02102010") {
                window.currentIsAdmin = true;
                router.navigate('hub', { isAdmin: true });
                showToast("התחברת כמנהל בהצלחה");
            } else if (pwd !== null) {
                showToast("סיסמה שגויה", true);
            }
        }

        // Intercept game clicks to trigger the access code popup first
        function requestGameAccess(gameId) {
            const config = GAME_ACCESS_CONFIG[gameId];
            if (!config) {
                // Fallback if config is missing
                router.navigate('game', { gameId, puzzleIndex: 0 });
                return;
            }

            const modalRoot = document.getElementById('access-modal-root');
            modalRoot.innerHTML = `
                <div class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
                    <div class="bg-zinc-900 border border-zinc-700 w-full max-w-md rounded-3xl p-6 shadow-2xl relative space-y-6 text-center animate-in fade-in zoom-in duration-200">
                        <button onclick="closeAccessModal()" class="absolute top-4 left-4 text-zinc-400 hover:text-white bg-zinc-800 w-8 h-8 rounded-full flex items-center justify-center font-bold transition">✕</button>
                        
                        <div class="w-12 h-12 bg-yellow-500/20 text-yellow-500 rounded-2xl mx-auto flex items-center justify-center text-2xl font-bold">🔒</div>
                        
                        <div class="space-y-2">
                            <h3 class="text-xl font-bold text-white">נדרש קוד גישה</h3>
                            <div class="bg-zinc-950 p-4 rounded-2xl border border-zinc-800 text-amber-300 font-semibold text-sm whitespace-pre-line leading-relaxed">
                                ${config.announcement}
                            </div>
                        </div>

                        <div class="space-y-3">
                            <input type="password" id="game-access-code-input" placeholder="הכנס קוד גישה (מספר)" class="w-full p-3 bg-zinc-800 border border-zinc-700 rounded-xl text-center text-white tracking-widest text-lg focus:outline-none focus:border-yellow-500 transition">
                            <div class="flex gap-2">
                                <button onclick="closeAccessModal()" class="flex-1 py-3 bg-zinc-800 hover:bg-zinc-700 text-zinc-300 font-bold rounded-xl text-sm transition">ביטול</button>
                                <button onclick="verifyGameAccess('${gameId}')" class="flex-1 py-3 bg-yellow-500 hover:bg-yellow-400 text-black font-bold rounded-xl text-sm shadow-lg transition">אישור</button>
                            </div>
                        </div>
                    </div>
                </div>
            `;

            // Focus input field automatically and support Enter key
            setTimeout(() => {
                const input = document.getElementById('game-access-code-input');
                if (input) {
                    input.focus();
                    input.addEventListener('keypress', (e) => {
                        if (e.key === 'Enter') verifyGameAccess(gameId);
                    });
                }
            }, 50);
        }

        window.closeAccessModal = () => {
            const modalRoot = document.getElementById('access-modal-root');
            modalRoot.innerHTML = '';
        };

        window.verifyGameAccess = (gameId) => {
            const input = document.getElementById('game-access-code-input');
            const config = GAME_ACCESS_CONFIG[gameId];
            if (!input || !config) return;

            const enteredVal = parseInt(input.value.trim(), 10);
            if (enteredVal === config.code) {
                closeAccessModal();
                router.navigate('game', { gameId, puzzleIndex: 0 });
            } else {
                showToast("קוד שגויי, נסה שוב", true);
                input.value = '';
                input.focus();
            }
        };

        const router = {
            navigate: async function(route, params = {}) {
                window.scrollTo(0, 0);
                const app = document.getElementById('app');
                app.innerHTML = '<div class="text-center py-20 text-zinc-500">טוען נתונים...</div>';
                
                await fetchRemoteData();

                app.innerHTML = '';
                if (route === 'hub') renderHub(app, params.isAdmin || false);
                else if (route === 'game') renderGame(app, params.gameId, params.puzzleIndex || 0);
                else if (route === 'admin') renderAdmin(app, params.gameId);
                else if (route === 'adminForm') renderAdminForm(app, params.gameId, params.puzzleIndex);
            }
        };

        function renderHub(container, isAdmin = false) {
            window.currentIsAdmin = isAdmin;
            const gamesList = [

                { id: 'wordle', title: 'וורדל 6 אותיות', desc: 'נחשו את המילה עם משוב חכם', icon: '🔤', color: 'from-emerald-500/20 to-teal-500/10' },

                        ${isAdmin ? `<button onclick="router.navigate('hub', {isAdmin: false})" class="px-3 py-1.5 bg-red-900/40 text-red-300 rounded-lg text-xs border border-red-500/30">יציאה ממצב מנהל</button>` : ''}

                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">

                            <div class="game-card bg-zinc-900 border border-zinc-700/50 rounded-2xl p-6 flex flex-col justify-between bg-gradient-to-br ${g.color}">

                                    <div class="text-4xl mb-4">${g.icon}</div>
                                    <h3 class="text-xl font-bold text-white mb-2">${g.title}</h3>
                                    <p class="text-zinc-400 text-sm mb-6">${g.desc}</p>
                                </div>
                                <div class="flex items-center gap-3 pt-4 border-t border-zinc-800/80">
                                    <button onclick="requestGameAccess('${g.id}')" class="flex-1 bg-yellow-500 hover:bg-yellow-400 text-black font-bold py-2.5 rounded-xl text-sm transition shadow-lg">שחק</button>

                            </div>
                        `).join('')}
                    </div>
                    ${isAdmin ? `
                        <div class="max-w-xl mx-auto bg-zinc-900 border border-zinc-800 p-6 rounded-2xl space-y-4 mt-10">

                            <input type="password" id="gh-token-input" value="${getGithubToken()}" placeholder="ghp_xxxxxxxxxxxx" class="w-full p-3 bg-zinc-800 border border-zinc-700 rounded-xl text-white text-sm">

            `;
        }

        window.saveToken = () => {
            const val = document.getElementById('gh-token-input').value.trim();

            showToast("הטוקן נשמר בהצלחה!");

        function renderNextPuzzleButton(gameId, currentIndex, totalPuzzles) {
            if (currentIndex < totalPuzzles - 1) {
                return `<button onclick="router.navigate('game', {gameId: '${gameId}', puzzleIndex: ${currentIndex + 1}})" class="px-6 py-3 mt-4 w-full bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-xl shadow-lg transition">המשך לחידה הבאה ➡️</button>`;
            }
            return `<p class="mt-4 text-sm text-zinc-500 font-bold">פתרת את כל החידות במשחק זה!</p>`;
        }

        function renderGame(container, gameId, puzzleIndex) {
            const data = getAppData();
            const gameData = data[gameId];
            if (!gameData || !gameData.puzzles || gameData.puzzles.length <= puzzleIndex) {
                container.innerHTML = `<div class="text-center py-16 space-y-4"><h3 class="text-2xl font-bold text-white">אין חידה זמינה</h3><button onclick="router.navigate('hub', {isAdmin: window.currentIsAdmin})" class="px-6 py-2 bg-yellow-500 text-black font-bold rounded-xl">חזרה לראשי</button></div>`;
                return;
            }
            const puzzle = gameData.puzzles[puzzleIndex];
            const total = gameData.puzzles.length;

            if (gameId === 'connections') initConnections(container, puzzle, gameId, puzzleIndex, total);
            else if (gameId === 'chain') initChain(container, puzzle, gameId, puzzleIndex, total);
            else if (gameId === 'wordle') initWordle(container, puzzle, gameId, puzzleIndex, total);
            else if (gameId === 'questions20') init20Questions(container, puzzle, gameId, puzzleIndex, total);
            else if (gameId === 'logicRiddle') initLogicRiddle(container, puzzle, gameId, puzzleIndex, total);
            else if (gameId === 'progressiveImage') initProgressiveImage(container, puzzle, gameId, puzzleIndex, total);
        }

        function initConnections(container, puzzle, gameId, puzzleIndex, totalPuzzles) {
            let allWords = [];
            puzzle.groups.forEach((g, gIdx) => g.words.forEach(w => allWords.push({ text: w, groupIdx: gIdx })));
            allWords.sort(() => Math.random() - 0.5);

            let selected = [];
            let solvedGroups = [];
            let mistakes = 4;

            function render() {
                container.innerHTML = `
                    <div class="max-w-xl mx-auto space-y-6 py-4">
                        <div class="flex justify-between items-center border-b border-zinc-800 pb-2">
                            <button onclick="router.navigate('hub', {isAdmin: window.currentIsAdmin})" class="text-sm text-zinc-400">חזרה</button>
                            <h2 class="text-xl font-bold text-white">${puzzle.name || 'קשרים'}</h2>
                            <div class="text-amber-400 font-bold text-sm">טעויות: ${mistakes}</div>
                        </div>
                        <div class="space-y-3">
                            ${solvedGroups.map(sg => `<div class="p-3 rounded-xl bg-amber-500/20 border border-amber-500/40 text-center"><div class="font-bold text-amber-300">${sg.category}</div><div class="text-sm text-zinc-200">${sg.words.join(', ')}</div></div>`).join('')}
                        </div>
                        ${solvedGroups.length === 4 ? `
                            <div class="p-6 bg-emerald-900/40 border border-emerald-500 rounded-xl text-center">
                                <h3 class="text-2xl font-bold text-emerald-400 mb-4">כל הכבוד!</h3>
                                ${renderNextPuzzleButton(gameId, puzzleIndex, totalPuzzles)}
                            </div>
                        ` : mistakes <= 0 ? `
                            <div class="p-6 bg-red-900/40 border border-red-500 rounded-xl text-center">
                                <h3 class="text-2xl font-bold text-red-400 mb-4">נגמרו הנסיונות!</h3>
                                <button onclick="router.navigate('game', {gameId: '${gameId}', puzzleIndex: ${puzzleIndex}})" class="px-6 py-2 bg-zinc-800 text-white rounded-xl">נסה שוב</button>
                            </div>
                        ` : `
                            <div class="grid grid-cols-4 gap-2 sm:gap-3">
                                ${allWords.map((w, i) => `<button onclick="con_toggle('${w.text}')" class="p-2 sm:p-4 rounded-lg font-bold text-xs sm:text-base transition border ${selected.includes(w.text) ? 'bg-amber-500 text-black border-amber-400 scale-95' : 'bg-zinc-800 text-zinc-200 border-zinc-700'}">${w.text}</button>`).join('')}
                            </div>
                            <div class="flex gap-2 justify-center pt-2">
                                <button onclick="con_shuffle()" class="px-4 py-2 bg-zinc-800 text-white rounded-lg">ערבוב</button>
                                <button onclick="con_clear()" class="px-4 py-2 bg-zinc-800 text-white rounded-lg">ניקוי</button>
                                <button onclick="con_submit()" class="px-6 py-2 bg-yellow-500 text-black font-bold rounded-lg">אישור</button>
                            </div>
                        `}
                    </div>
                `;
            }

            window.con_toggle = (w) => {
                if (selected.includes(w)) selected = selected.filter(x => x !== w);
                else if (selected.length < 4) selected.push(w);
                render();
            };
            window.con_shuffle = () => { allWords.sort(() => Math.random() - 0.5); render(); };
            window.con_clear = () => { selected = []; render(); };
            window.con_submit = () => {
                if (selected.length !== 4) return showToast('יש לבחור 4 מילים בדיוק', true);
                let maxMatch = 0;
                let matchedGroup = null;
                puzzle.groups.forEach(g => {
                    let matchCount = selected.filter(w => g.words.includes(w)).length;
                    if (matchCount > maxMatch) maxMatch = matchCount;
                    if (matchCount === 4) matchedGroup = g;
                });

                if (matchedGroup) {
                    solvedGroups.push(matchedGroup);
                    allWords = allWords.filter(w => !matchedGroup.words.includes(w.text));
                    selected = [];
                    showToast('קבוצה נכונה!');
                } else {
                    mistakes--;
                    if (maxMatch === 3) showToast('מרחק מילה אחת!', true);
                    else showToast('טעות, נסו שוב', true);
                }
                render();
            };
            render();
        }

        function initChain(container, puzzle, gameId, puzzleIndex, totalPuzzles) {
            let slots = new Array(puzzle.middle.length).fill(null);
            let slotsColors = new Array(puzzle.middle.length).fill('');
            
            let allSidelineWords = [...puzzle.middle.map(m => m.word), ...(puzzle.distractors || [])];
            allSidelineWords.sort(() => Math.random() - 0.5);

            let attempts = 0;
            let isWon = false;
            let isChecking = false;

            function render() {
                const midIdx = Math.ceil(allSidelineWords.length / 2);
                const leftSide = allSidelineWords.slice(0, midIdx);
                const rightSide = allSidelineWords.slice(midIdx);

                container.innerHTML = `
                    <div class="max-w-xl mx-auto space-y-6 py-4">
                        <div class="flex justify-between items-center border-b border-zinc-800 pb-2">
                            <button onclick="router.navigate('hub', {isAdmin: window.currentIsAdmin})" class="text-sm text-zinc-400">חזרה</button>
                            <h2 class="text-xl font-bold text-white">${puzzle.name || 'השרשרת'}</h2>
                            <div class="text-amber-400 font-bold text-sm">ניסיונות: ${attempts}/5</div>
                        </div>

                        <div class="grid grid-cols-3 items-center gap-4 bg-zinc-900 border border-zinc-800 rounded-3xl p-6">
                            <div class="flex flex-col gap-3 items-center min-h-[250px] justify-center transition-colors rounded-2xl p-2" ondragover="event.preventDefault()" ondrop="ch_drop(event, 'sideline')">
                                ${leftSide.map(w => `
                                    <div draggable="${!isChecking && !isWon}" 
                                         ondragstart="ch_dragStart(event, '${w}', 'sideline')" 
                                         onclick="!${isChecking} && !${isWon} && ch_quickPlace('${w}')" 
                                         class="w-20 h-20 rounded-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-sm flex items-center justify-center p-2 text-center shadow transition cursor-grab active:cursor-grabbing">
                                        ${w}
                                    </div>
                                `).join('')}
                            </div>

                            <div class="flex flex-col items-center space-y-2">
                                <div class="w-16 h-16 rounded-full bg-white text-black font-extrabold flex items-center justify-center text-sm border-4 border-amber-500 shadow">${puzzle.start}</div>
                                <div class="w-1 h-3 bg-zinc-700"></div>

                                ${slots.map((word, i) => {
                                    let bg = word ? 'bg-amber-500/25 border-amber-500 text-amber-100' : 'bg-zinc-800/80 border-zinc-700 text-zinc-500 border-dashed';
                                    if (slotsColors[i] === 'green') bg = 'bg-emerald-600 border-emerald-400 text-white';
                                    if (slotsColors[i] === 'red') bg = 'bg-red-600 border-red-400 text-white';
                                    if (isWon) bg = 'bg-emerald-600 border-emerald-400 text-white';
                                    return `
                                    <div draggable="${word && !isChecking && !isWon}" 
                                         ondragstart="${word && !isWon ? `ch_dragStart(event, '${word}', 'slot', ${i})` : ''}" 
                                         ondragover="event.preventDefault()" 
                                         ondrop="ch_drop(event, 'slot', ${i})" 
                                         onclick="!${isChecking} && !${isWon} && ch_remove(${i})" 
                                         class="w-16 h-16 rounded-full border-2 flex items-center justify-center font-bold text-xs transition ${bg} p-1 text-center ${word && !isWon ? 'cursor-grab active:cursor-grabbing' : 'cursor-pointer'}">
                                        ${word || `חוליה ${i+1}`}
                                    </div>
                                    <div class="w-1 h-3 bg-zinc-700"></div>
                                    `;
                                }).join('')}

                                <div class="w-16 h-16 rounded-full bg-white text-black font-extrabold flex items-center justify-center text-sm border-4 border-amber-500 shadow">${puzzle.end}</div>
                            </div>

                            <div class="flex flex-col gap-3 items-center min-h-[250px] justify-center transition-colors rounded-2xl p-2" ondragover="event.preventDefault()" ondrop="ch_drop(event, 'sideline')">
                                ${rightSide.map(w => `
                                    <div draggable="${!isChecking && !isWon}" 
                                         ondragstart="ch_dragStart(event, '${w}', 'sideline')" 
                                         onclick="!${isChecking} && !${isWon} && ch_quickPlace('${w}')" 
                                         class="w-20 h-20 rounded-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-sm flex items-center justify-center p-2 text-center shadow transition cursor-grab active:cursor-grabbing">
                                        ${w}
                                    </div>
                                `).join('')}
                            </div>
                        </div>

                        <p class="text-center text-xs text-zinc-400">טיפ: ניתן לגרור חוליות או ללחוץ עליהן לשיבוץ מהיר!</p>

                        ${isWon ? `
                            <div class="p-6 bg-emerald-900/40 border border-emerald-500 rounded-xl space-y-3">
                                <h3 class="text-xl font-bold text-emerald-400 text-center">${attempts >= 5 ? 'נגמרו הניסיונות! הנה התשובה הנכונה:' : 'הצלחת! הסברים לשרשרת:'}</h3>
                                <ul class="space-y-2 text-sm text-zinc-300">
                                    ${puzzle.middle.map((m, i) => `<li><strong class="text-white">${m.word}:</strong> ${m.explanation}</li>`).join('')}
                                </ul>
                                ${renderNextPuzzleButton(gameId, puzzleIndex, totalPuzzles)}
                            </div>
                        ` : `
                            <div class="flex gap-3 justify-center">
                                <button onclick="!${isChecking} && ch_clear()" class="px-6 py-2.5 bg-zinc-800 text-white rounded-xl text-sm font-semibold">ניקוי לוח</button>
                                <button onclick="!${isChecking} && ch_check()" class="px-8 py-2.5 bg-yellow-500 hover:bg-yellow-400 text-black font-bold rounded-xl text-sm shadow">אישור</button>
                            </div>
                        `}
                    </div>
                `;
            }

            window.ch_dragStart = (e, word, source, slotIndex = null) => {
                e.dataTransfer.setData('text/plain', JSON.stringify({ word, source, slotIndex }));
                e.dataTransfer.effectAllowed = 'move';
            };

            window.ch_drop = (e, targetType, targetSlotIdx = null) => {
                e.preventDefault();
                if (isChecking || isWon) return;
                try {
                    const rawData = e.dataTransfer.getData('text/plain');
                    if (!rawData) return;
                    const data = JSON.parse(rawData);
                    const word = data.word;
                    const source = data.source;
                    const prevSlotIdx = data.slotIndex;

                    if (source === 'slot' && prevSlotIdx !== null) {
                        slots[prevSlotIdx] = null;
                    } else if (source === 'sideline') {
                        allSidelineWords = allSidelineWords.filter(x => x !== word);
                    }

                    if (targetType === 'slot' && targetSlotIdx !== null) {
                        if (slots[targetSlotIdx]) {
                            allSidelineWords.push(slots[targetSlotIdx]);
                        }
                        slots[targetSlotIdx] = word;
                    } else if (targetType === 'sideline') {
                        allSidelineWords.push(word);
                    }

                    render();
                } catch (err) {}
            };

            window.ch_quickPlace = (w) => {
                if (isWon) return;
                const idx = slots.indexOf(null);
                if (idx > -1) { 
                    slots[idx] = w; 
                    allSidelineWords = allSidelineWords.filter(x => x !== w); 
                    render(); 
                }
            };

            window.ch_remove = (idx) => {
                if (isWon) return;
                if (slots[idx]) { 
                    allSidelineWords.push(slots[idx]); 
                    slots[idx] = null; 
                    render(); 
                }
            };

            window.ch_clear = () => { 
                if (isWon) return;
                allSidelineWords.push(...slots.filter(Boolean)); 
                slots.fill(null); 
                render(); 
            };

            window.ch_check = () => {
                if (slots.includes(null)) return showToast('מלא את כל החוליות בשרשרת', true);
                attempts++;
                isChecking = true;
                let correctCount = 0;
                
                slots.forEach((w, i) => {
                    if (w === puzzle.middle[i].word) { slotsColors[i] = 'green'; correctCount++; }
                    else slotsColors[i] = 'red';
                });
                render();

                setTimeout(() => {
                    if (correctCount === puzzle.middle.length) {
                        isWon = true;
                    } else if (attempts >= 5) {
                        showToast('נגמרו הניסיונות! הנה התשובה הנכונה', true);
                        slots = puzzle.middle.map(m => m.word);
                        allSidelineWords = [];
                        isWon = true;
                    } else {
                        slots.forEach((w, i) => {
                            if (slotsColors[i] === 'red') { allSidelineWords.push(w); slots[i] = null; }
                        });
                        showToast('חלק מהחוליות שגויות', true);
                    }
                    slotsColors.fill('');
                    isChecking = false;
                    render();
                }, 1200);
            };
            render();
        }

        function initWordle(container, puzzle, gameId, puzzleIndex, totalPuzzles) {
            const target = puzzle.word.trim();
            let guesses = [];
            let current = "";
            let over = false;
            let won = false;
            
            const finalMap = { 'כ': 'ך', 'מ': 'ם', 'נ': 'ן', 'פ': 'ף', 'צ': 'ץ' };
            const baseMap = { 'ך': 'כ', 'ם': 'מ', 'ן': 'נ', 'ף': 'פ', 'ץ': 'צ' };
            const kbRows = [['פ','ו','ט','א','ר','ק'], ['ל','ח','י','ע','כ','ג','ד','ש'], ['ת','צ','מ','נ','ה','ב','ס','ז']];

            function render() {
                container.innerHTML = `
                    <div class="max-w-md mx-auto space-y-4 py-4">
                        <div class="flex justify-between items-center border-b border-zinc-800 pb-2">
                            <button onclick="router.navigate('hub', {isAdmin: window.currentIsAdmin})" class="text-sm text-zinc-400">חזרה</button>
                            <h2 class="text-xl font-bold text-white">וורדל</h2>
                            <div class="text-amber-400 text-xs">${puzzle.clue}</div>
                        </div>

                        <div class="grid grid-rows-6 gap-2 w-max mx-auto" dir="rtl">
                            ${Array.from({length: 6}, (_, r) => {
                                const g = guesses[r] || (r === guesses.length && !over ? current : "");
                                return `<div class="grid grid-cols-6 gap-2">
                                    ${Array.from({length: 6}, (_, c) => {
                                        let char = g[c] || "";
                                        if (c === 5 && char && finalMap[char]) char = finalMap[char];
                                        let bg = "bg-zinc-900 border-zinc-700 text-white";
                                        if (r < guesses.length) {
                                            const tChar = baseMap[target[c]] || target[c];
                                            const gChar = baseMap[g[c]] || g[c];
                                            if (tChar === gChar) bg = "bg-emerald-600 border-emerald-500 text-white";
                                            else if (target.includes(gChar)) bg = "bg-amber-600 border-amber-500 text-white";
                                            else bg = "bg-zinc-800 border-zinc-800 text-zinc-500";
                                        }
                                        return `<div class="w-10 h-10 sm:w-12 sm:h-12 border-2 rounded flex items-center justify-center font-bold text-xl ${bg}">${char}</div>`;
                                    }).join('')}
                                </div>`;
                            }).join('')}
                        </div>

                        ${over ? `
                            <div class="p-4 rounded-xl text-center ${won ? 'bg-emerald-900/40 text-emerald-400' : 'bg-red-900/40 text-red-400'}">
                                <h3 class="font-bold text-xl mb-2">${won ? 'כל הכבוד!' : `הפסדת! המילה: ${target}`}</h3>
                                ${renderNextPuzzleButton(gameId, puzzleIndex, totalPuzzles)}
                            </div>
                        ` : `
                            <div class="space-y-2 pt-4">
                                ${kbRows.map(row => `
                                    <div class="flex justify-center gap-1 sm:gap-2">
                                        ${row.map(k => `<button onclick="w_key('${k}')" class="px-3 sm:px-4 py-3 bg-zinc-800 text-white font-bold rounded-lg text-lg shadow active:bg-zinc-600 active:scale-95 transition">${k}</button>`).join('')}
                                    </div>
                                `).join('')}
                                <div class="flex justify-center gap-2 mt-2">
                                    <button onclick="w_key('ENTER')" class="px-6 py-3 bg-yellow-500 text-black font-bold rounded-lg text-sm shadow">אישור</button>
                                    <button onclick="w_key('BACK')" class="px-6 py-3 bg-zinc-700 text-white font-bold rounded-lg text-sm shadow">מחק</button>
                                </div>
                            </div>
                        `}
                    </div>
                `;
            }

            window.w_key = (k) => {
                if (over) return;
                if (k === 'BACK') current = current.slice(0, -1);
                else if (k === 'ENTER') {
                    if (current.length !== 6) return showToast('נדרשות 6 אותיות בדיוק', true);
                    guesses.push(current);
                    if (current === target) { over = true; won = true; }
                    else if (guesses.length === 6) { over = true; }
                    current = "";
                } else if (current.length < 6) current += k;
                render();
            };
            render();
        }

        function init20Questions(container, puzzle, gameId, puzzleIndex, totalPuzzles) {
            let items = puzzle.items || [];
            let curr = 0;
            let states = new Array(items.length).fill(null);
            let show = false;
            let finished = false;

            function render() {
                if (finished) {
                    const score = states.filter(s => s === 'V').length;
                    container.innerHTML = `<div class="max-w-lg mx-auto py-10 text-center space-y-6"><h2 class="text-3xl font-bold">סיכום שאלון</h2><div class="text-5xl font-black text-amber-400">${score}/${items.length}</div>${renderNextPuzzleButton(gameId, puzzleIndex, totalPuzzles)}</div>`;
                    return;
                }
                const q = items[curr];
                container.innerHTML = `
                    <div class="max-w-lg mx-auto space-y-6 py-4">
                        <div class="flex justify-between items-center border-b border-zinc-800 pb-2">
                            <button onclick="router.navigate('hub', {isAdmin: window.currentIsAdmin})" class="text-sm text-zinc-400">חזרה</button>
                            <h2 class="text-xl font-bold text-white">${puzzle.title}</h2>
                            <div class="text-amber-400 text-sm">${curr+1}/${items.length}</div>
                        </div>
                        <div class="bg-zinc-900 border border-zinc-800 rounded-3xl p-8 space-y-6 text-center">
                            <h3 class="text-2xl font-bold text-white">${q.q}</h3>
                            ${!show ? `
                                <button onclick="q_show()" class="px-6 py-3 bg-yellow-500 text-black font-bold rounded-xl mt-6">הצג תשובה</button>
                            ` : `
                                <div class="p-4 bg-blue-900/30 text-blue-200 rounded-xl text-lg">${q.a}</div>
                                <div class="flex gap-4 justify-center pt-4 border-t border-zinc-800">
                                    <button onclick="q_ans('V')" class="px-8 py-3 bg-emerald-600 text-white font-bold rounded-xl text-xl">✅ נכון</button>
                                    <button onclick="q_ans('X')" class="px-8 py-3 bg-red-600 text-white font-bold rounded-xl text-xl">❌ טעות</button>
                                </div>
                            `}
                        </div>
                    </div>
                `;
            }
            window.q_show = () => { show = true; render(); };
            window.q_ans = (v) => {
                states[curr] = v;
                if (curr < items.length - 1) { curr++; show = false; }
                else finished = true;
                render();
            };
            render();
        }

        function initLogicRiddle(container, puzzle, gameId, puzzleIndex, totalPuzzles) {
            const ans = puzzle.answer; 
            const len = ans.length;
            
            let inputChars = Array.from(ans, char => char === ' ' ? ' ' : '');
            let mistakes = 0;
            let hints = 0;
            let over = false;
            let won = false;
            const kbRows = [['פ','ו','ט','א','ר','ק'], ['ל','ח','י','ע','כ','ג','ד','ש'], ['ת','צ','מ','נ','ה','ב','ס','ז']];

            function render() {
                container.innerHTML = `
                    <div class="max-w-md mx-auto space-y-6 py-4">
                        <div class="flex justify-between items-center border-b border-zinc-800 pb-2">
                            <button onclick="router.navigate('hub', {isAdmin: window.currentIsAdmin})" class="text-sm text-zinc-400">חזרה</button>
                            <h2 class="text-xl font-bold text-white">הגיונית</h2>
                            <div class="text-amber-400 text-sm">ניסיונות: ${3-mistakes}</div>
                        </div>
                        <div class="bg-zinc-900 p-6 rounded-2xl text-center border border-zinc-800 shadow-lg">
                            <div class="text-xs text-zinc-500 mb-2">${puzzle.date}</div>
                            <h3 class="text-xl font-bold text-white">${puzzle.riddle}</h3>
                        </div>
                        <div class="flex flex-wrap justify-center gap-1.5" dir="rtl">
                            ${Array.from({length: len}, (_, i) => {
                                if (ans[i] === ' ') {
                                    return `<div class="w-4 flex items-center justify-center"></div>`;
                                }
                                return `<div class="w-10 h-12 border-b-4 ${inputChars[i] ? 'border-amber-500' : 'border-zinc-700'} flex items-center justify-center font-bold text-2xl text-white">${inputChars[i]}</div>`;
                            }).join('')}
                        </div>
                        
                        ${over ? `
                            <div class="p-6 text-center rounded-2xl ${won ? 'bg-emerald-900/40' : 'bg-red-900/40'}">
                                <h3 class="text-xl font-bold text-white mb-4">${won ? 'מצוין!' : `הפסדת. התשובה: ${ans}`}</h3>
                                ${renderNextPuzzleButton(gameId, puzzleIndex, totalPuzzles)}
                            </div>
                        ` : `
                            <div class="flex gap-2 justify-center">
                                <button onclick="r_hint()" class="px-4 py-2 bg-indigo-900/50 text-indigo-300 rounded-lg text-sm border border-indigo-500/30">רמז</button>
                                <button onclick="r_check()" class="px-6 py-2 bg-yellow-500 text-black font-bold rounded-lg text-sm shadow">אישור ניחוש</button>
                            </div>
                            <div class="space-y-2 pt-2">
                                ${kbRows.map(row => `
                                    <div class="flex justify-center gap-1 sm:gap-2">
                                        ${row.map(k => `<button onclick="r_key('${k}')" class="px-3 sm:px-4 py-3 bg-zinc-800 text-white font-bold rounded-lg text-lg shadow active:bg-zinc-600 transition">${k}</button>`).join('')}
                                    </div>
                                `).join('')}
                                <div class="flex justify-center mt-2">
                                    <button onclick="r_key('BACK')" class="px-10 py-3 bg-zinc-700 text-white font-bold rounded-lg text-sm shadow">מחיקה</button>
                                </div>
                            </div>
                        `}
                    </div>
                `;
            }

            window.r_key = (k) => {
                if(over) return;
                if(k === 'BACK') {
                    for(let i=len-1; i>=0; i--) {
                        if(ans[i] !== ' ' && inputChars[i] && (hints === 0 || ans.slice(0, i+1).replace(/\s+/g,'').length > hints)) { 
                            inputChars[i] = ""; 
                            break; 
                        }
                    }
                } else {
                    for(let i=0; i<len; i++) {
                        if(ans[i] !== ' ' && !inputChars[i]) {
                            inputChars[i] = k;
                            break;
                        }
                    }
                }
                render();
            };

            window.r_hint = () => {
                for(let i=0; i<len; i++) {
                    if(ans[i] !== ' ' && !inputChars[i]) {
                        inputChars[i] = ans[i];
                        hints++;
                        showToast('נוסף רמז');
                        render();
                        return;
                    }
                }
                showToast('כל האותיות כבר הוצגו', true);
            };

            window.r_check = () => {
                for(let i=0; i<len; i++) {
                    if(ans[i] !== ' ' && !inputChars[i]) return showToast('מלאו את כל התיבות', true);
                }
                const guess = inputChars.join('');
                if (guess === ans) { over = true; won = true; }
                else {
                    mistakes++;
                    if (mistakes >= 3) { over = true; won = false; }
                    else {
                        for(let i=0; i<len; i++) {
                            if(ans[i] !== ' ' && inputChars[i] !== ans[i]) inputChars[i] = ""; 
                        }
                        showToast('טעות! אותיות שגויות נמחקו', true);
                    }
                }
                render();
            };
            render();
        }

        function initProgressiveImage(container, puzzle, gameId, puzzleIndex, totalPuzzles) {
            let steps = puzzle.steps || [];
            if (steps.length === 0) steps = ["https://placehold.co/400x400/1e1e1e/eab308?text=No+Image"];
            let curr = 0;
            let val = "";
            let over = false;
            let won = false;

            function render() {
                container.innerHTML = `
                    <div class="max-w-md mx-auto space-y-6 py-4">
                        <div class="flex justify-between items-center border-b border-zinc-800 pb-2">
                            <button onclick="router.navigate('hub', {isAdmin: window.currentIsAdmin})" class="text-sm text-zinc-400">חזרה</button>
                            <h2 class="text-xl font-bold text-white">מי אני?</h2>
                            <div class="text-amber-400 text-sm">שלב ${curr+1}/${steps.length}</div>
                        </div>

                        <div class="bg-zinc-900 border border-zinc-800 rounded-3xl p-4 flex flex-col items-center shadow-lg">
                            <img src="${steps[curr]}" class="w-full aspect-square object-cover rounded-2xl mb-4 bg-zinc-950">
                            
                            ${over ? `
                                <div class="w-full text-center space-y-4">
                                    <h3 class="text-2xl font-bold ${won ? 'text-emerald-400' : 'text-red-400'}">${won ? 'כל הכבוד!' : 'המשחק נגמר'}</h3>
                                    <p class="text-white text-lg">התשובה: ${puzzle.answer}</p>${renderNextPuzzleButton(gameId, puzzleIndex, totalPuzzles)}
                                </div>
                            ` : `
                                <button onclick="p_next()" class="w-full py-3 bg-amber-500 text-black font-bold rounded-xl mb-4 shadow">🔍 לתמונה ברורה יותר</button>
                                <div class="flex gap-2 w-full">
                                    <input type="text" id="p-guess" value="${val}" placeholder="מי בתמונה?" class="flex-1 bg-zinc-800 border-zinc-700 rounded-xl px-4 text-white focus:outline-none">
                                    <button onclick="p_check()" class="px-6 py-3 bg-zinc-700 text-white font-bold rounded-xl">אישור</button>
                                </div>
                            `}
                        </div>
                    </div>
                `;
            }

            window.p_next = () => {
                if (curr < steps.length - 1) { curr++; showToast('עובר לשלב הבא'); }
                else { over = true; won = false; showToast('אין יותר רזולוציות!', true); }
                render();
            };
            window.p_check = () => {
                const el = document.getElementById('p-guess');
                val = el ? el.value.trim() : "";
                if(!val) return;
                if(val === puzzle.answer) { over = true; won = true; }
                else {
                    if (curr < steps.length - 1) { curr++; showToast('טעות, התקדמת שלב', true); val = ""; }
                    else { over = true; won = false; showToast('טעות! המשחק נגמר', true); }
                }
                render();
            };
            render();
        }

        function renderAdmin(container, gameId) {
            const data = getAppData();
            const gameData = data[gameId];

            container.innerHTML = `
                <div class="max-w-3xl mx-auto space-y-6 py-4">
                    <div class="flex justify-between items-center border-b border-zinc-800 pb-4">
                        <button onclick="router.navigate('hub', {isAdmin: true})" class="text-zinc-400">← חזרה</button>
                        <h2 class="text-2xl font-black text-white">: ${gameData.title}</h2>
                        ${gameId !== 'progressiveImage' || gameData.puzzles.length === 0 ? `<button onclick="router.navigate('adminForm', {gameId: '${gameId}', puzzleIndex: -1})" class="px-4 py-2 bg-yellow-500 text-black font-bold rounded-xl text-sm">➕ הוסף חדש</button>` : `<span class="text-xs text-zinc-500">חידה פעילה יחידה</span>`}
                    </div>
                    <div class="space-y-3">
                        ${gameData.puzzles.length === 0 ? `<div class="text-zinc-500 text-center py-6">אין חידות. הוסף אחת!</div>` : ''}
                        ${gameData.puzzles.map((p, idx) => `
                            <div class="bg-zinc-900 border border-zinc-800 rounded-xl p-4 flex items-center justify-between">
                                <div><h4 class="font-bold text-white">חידה #${idx + 1}</h4><p class="text-xs text-zinc-500">${p.name || p.answer || p.word || p.title || p.riddle || ''}</p></div>
                                <div class="flex gap-2">
                                    <button onclick="router.navigate('adminForm', {gameId: '${gameId}', puzzleIndex:${idx}})" class="px-4 py-2 bg-zinc-800 text-white rounded-lg text-sm">עריכה</button>
                                    ${gameId !== 'progressiveImage' ? `<button onclick="adm_del('${gameId}',${idx})" class="px-4 py-2 bg-red-900/40 text-red-300 rounded-lg text-sm">מחיקה</button>` : ''}
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        window.adm_del = (gId, idx) => {
            const data = getAppData();
            data[gId].puzzles.splice(idx, 1);
            saveAppData(data);
            showToast('נמחק בהצלחה');
            renderAdmin(document.getElementById('app'), gId);
        };

        function renderAdminForm(container, gameId, puzzleIndex) {
            const data = getAppData();
            const isNew = puzzleIndex === -1;
            let p = isNew ? {} : JSON.parse(JSON.stringify(data[gameId].puzzles[puzzleIndex]));

            if (isNew) {
                p.id = Date.now();
                if (gameId === 'connections') p = { ...p, name: "חידה חדשה", groups: Array(4).fill({category: "", words: ["","","",""]}) };
                if (gameId === 'chain') p = { ...p, name: "שרשרת חדשה", start: "", end: "", middle: [{word: "", explanation: ""}], distractors: [""] };
                if (gameId === 'wordle') p = { ...p, word: "", clue: "" };
                if (gameId === 'questions20') p = { ...p, title: "שאלון חדש", items: [{q: "", a: ""}] };
                if (gameId === 'logicRiddle') p = { ...p, riddle: "", answer: "", date: "" };
                if (gameId === 'progressiveImage') p = { ...p, answer: "", steps: Array(6).fill("") };
            }

            let formHtml = '';

            if (gameId === 'connections') {
                formHtml = `
                    <input type="text" id="f_name" value="${p.name || ''}" class="w-full p-2 bg-zinc-800 text-white rounded mb-4" placeholder="שם החידה">
                    ${p.groups.map((g, i) => `
                        <div class="border border-zinc-700 p-4 rounded-xl space-y-2 mt-4 bg-zinc-900/50">
                            <label class="text-sm font-bold text-amber-400">קבוצה ${i+1}</label>
                            <input type="text" id="f_cat_${i}" value="${g.category}" class="w-full p-2 bg-zinc-800 text-white rounded" placeholder="שם הקטגוריה">
                            <div class="grid grid-cols-2 gap-2">
                                ${g.words.map((w, wi) => `<input type="text" id="f_w_${i}_${wi}" value="${w}" class="w-full p-2 bg-zinc-800 text-white rounded" placeholder="מילה ${wi+1}">`).join('')}
                            </div>
                        </div>
                    `).join('')}
                `;
            } else if (gameId === 'chain') {
                formHtml = `
                    <input type="text" id="f_c_name" value="${p.name || ''}" class="w-full p-2 bg-zinc-800 text-white rounded mb-4" placeholder="שם השרשרת">
                    <div class="grid grid-cols-2 gap-4 mb-4">
                        <div><label class="text-xs">מילת התחלה</label><input type="text" id="f_c_start" value="${p.start || ''}" class="w-full p-2 bg-zinc-800 text-white rounded"></div>
                        <div><label class="text-xs">מילת סיום</label><input type="text" id="f_c_end" value="${p.end || ''}" class="w-full p-2 bg-zinc-800 text-white rounded"></div>
                    </div>
                    <label class="font-bold text-amber-400 block mb-2">חוליות נכונות בסדר עולה:</label>
                    <div id="chain-middle-container" class="space-y-3">
                        ${p.middle.map((m, i) => `
                            <div class="flex gap-2 items-center bg-zinc-900 p-3 rounded-xl border border-zinc-700">
                                <input type="text" placeholder="מילה" class="f_m_word w-1/3 p-2 bg-zinc-800 text-white rounded" value="${m.word}">
                                <input type="text" placeholder="הסבר" class="f_m_exp flex-1 p-2 bg-zinc-800 text-white rounded" value="${m.explanation}">
                            </div>
                        `).join('')}
                    </div>
                    <button type="button" onclick="addChainMiddleField()" class="mt-2 px-3 py-1 bg-zinc-800 text-xs rounded text-amber-400">+ הוסף חוליה</button>
                    
                    <div class="mt-6">
                        <label class="font-bold text-amber-400 block mb-2">מסיחים (מילים שגויות לצדדים):</label>
                        <input type="text" id="f_c_distractors" value="${(p.distractors || []).join(', ')}" class="w-full p-2 bg-zinc-800 text-white rounded" placeholder="הפרד בפסיקים, למשל: סמי, סרט">
                    </div>
                `;
            } else if (gameId === 'wordle') {
                formHtml = `
                    <label class="block text-sm font-bold mb-1">מילה (6 אותיות)</label>
                    <input type="text" id="f_w" value="${p.word}" class="w-full p-3 bg-zinc-800 text-white rounded mb-4" placeholder="דוגמה: מחשבה">
                    <label class="block text-sm font-bold mb-1">רמז</label>
                    <input type="text" id="f_c" value="${p.clue}" class="w-full p-3 bg-zinc-800 text-white rounded" placeholder="רמז למילה">
                `;
            } else if (gameId === 'questions20') {
                formHtml = `
                    <input type="text" id="f_20_title" value="${p.title || ''}" class="w-full p-2 bg-zinc-800 text-white rounded mb-4" placeholder="כותרת השאלון">
                    <div id="questions-items-container" class="space-y-3">
                        ${(p.items || []).map((item, i) => `
                            <div class="flex gap-2 items-center bg-zinc-900 p-3 rounded-xl border border-zinc-700">
                                <span class="font-bold text-xs">${i+1}</span>
                                <input type="text" placeholder="שאלה" class="q_item_q flex-1 p-2 bg-zinc-800 text-white rounded" value="${item.q}">
                                <input type="text" placeholder="תשובה" class="q_item_a w-1/3 p-2 bg-zinc-800 text-white rounded" value="${item.a}">
                            </div>
                        `).join('')}
                    </div>
                    <button type="button" onclick="add20QuestionField()" class="mt-2 px-3 py-1 bg-zinc-800 text-xs rounded text-amber-400">+ הוסף שאלה</button>
                `;
            } else if (gameId === 'logicRiddle') {
                formHtml = `
                    <label class="block text-sm font-bold mb-1">חידה</label>
                    <input type="text" id="f_r" value="${p.riddle}" class="w-full p-3 bg-zinc-800 text-white rounded mb-4" placeholder="טקסט החידה">
                    <label class="block text-sm font-bold mb-1">תשובה (ניתן לכלול רווחים)</label>
                    <input type="text" id="f_a" value="${p.answer}" class="w-full p-3 bg-zinc-800 text-white rounded mb-4">
                    <label class="block text-sm font-bold mb-1">תאריך/כותרת משנה</label>
                    <input type="text" id="f_d" value="${p.date}" class="w-full p-3 bg-zinc-800 text-white rounded">
                `;
            } else if (gameId === 'progressiveImage') {
                formHtml = `
                    <label class="block text-sm font-bold mb-1">התשובה (מי הדמות?)</label>
                    <input type="text" id="f_ans" value="${p.answer}" class="w-full p-3 bg-zinc-800 text-white rounded mb-4">
                    <p class="text-sm text-zinc-400 mb-2">העלה 6 רזולוציות מדורגות (החל מראשונית ומטושטשת ועד למקורית). התמונות יישמרו אוטומטית ב-GitHub בתיקיית images.</p>
                    <div class="space-y-3" id="img-uploads-container">
                        ${Array.from({length: 6}, (_, i) => `
                            <div class="flex items-center gap-4 bg-zinc-900 p-3 rounded-lg border border-zinc-700">
                                <div class="font-bold w-16 text-center">שלב ${i+1}</div>
                                <input type="file" accept="image/*" onchange="handleProgImgFile(this, ${i})" class="text-sm text-zinc-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:bg-zinc-800 file:text-white">
                                <img id="preview_${i}" src="${p.steps && p.steps[i] ? p.steps[i] : ''}" class="w-10 h-10 object-cover rounded bg-zinc-950 ${p.steps && p.steps[i] ? '' : 'hidden'}">
                                <input type="hidden" id="f_img_${i}" value="${p.steps && p.steps[i] ? p.steps[i] : ''}">
                            </div>
                        `).join('')}
                    </div>
                `;
            }

            container.innerHTML = `
                <div class="max-w-2xl mx-auto space-y-6 py-4">
                    <div class="flex justify-between items-center border-b border-zinc-800 pb-4">
                        <button onclick="router.navigate('admin', {gameId: '${gameId}'})" class="text-zinc-400">← ביטול</button>
                        <h2 class="text-2xl font-black text-white">${isNew ? 'הוספת חידה חדשה' : 'עריכת חידה'}</h2>
                        <button onclick="saveAdminForm('${gameId}', ${puzzleIndex})" class="px-6 py-2 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl shadow-lg transition">שמור שינויים</button>
                    </div>
                    <div class="bg-zinc-900/30 p-4 sm:p-6 rounded-2xl border border-zinc-800">
                        ${formHtml}
                    </div>
                </div>
            `;
        }

        window.addChainMiddleField = () => {
            const container = document.getElementById('chain-middle-container');
            const div = document.createElement('div');
            div.className = "flex gap-2 items-center bg-zinc-900 p-3 rounded-xl border border-zinc-700";
            div.innerHTML = `<input type="text" placeholder="מילה" class="f_m_word w-1/3 p-2 bg-zinc-800 text-white rounded"><input type="text" placeholder="הסבר" class="f_m_exp flex-1 p-2 bg-zinc-800 text-white rounded">`;
            container.appendChild(div);
        };

        window.add20QuestionField = () => {
            const container = document.getElementById('questions-items-container');
            const count = container.children.length + 1;
            const div = document.createElement('div');
            div.className = "flex gap-2 items-center bg-zinc-900 p-3 rounded-xl border border-zinc-700";
            div.innerHTML = `<span class="font-bold text-xs">${count}</span><input type="text" placeholder="שאלה" class="q_item_q flex-1 p-2 bg-zinc-800 text-white rounded"><input type="text" placeholder="תשובה" class="q_item_a w-1/3 p-2 bg-zinc-800 text-white rounded">`;
            container.appendChild(div);
        };

        window.handleProgImgFile = async (input, index) => {
            const file = input.files[0];
            if (!file) return;
            try {
                showToast(`מעלה תמונה ${index+1} ל-GitHub...`);
                const b64 = await fileToBase64(file);
                const path = `images/step_${index + 1}.jpg`;
                const remoteUrl = await uploadImageToGitHub(path, b64);
                
                document.getElementById(`f_img_${index}`).value = remoteUrl;
                const preview = document.getElementById(`preview_${index}`);
                preview.src = remoteUrl;
                preview.classList.remove('hidden');
                showToast(`תמונה ${index+1} הועלתה וסונכרנה בהצלחה!`);
            } catch (err) {
                showToast(err.message, true);
            }
        };

        window.saveAdminForm = async (gameId, puzzleIndex) => {
            const data = getAppData();
            const isNew = puzzleIndex === -1;
            let p = isNew ? { id: Date.now() } : data[gameId].puzzles[puzzleIndex];

            try {
                if (gameId === 'connections') {
                    p.name = document.getElementById('f_name').value || "חידה";
                    p.groups = [];
                    for(let i=0; i<4; i++) {
                        let cat = document.getElementById(`f_cat_${i}`).value;
                        let words = [];
                        for(let wi=0; wi<4; wi++) words.push(document.getElementById(`f_w_${i}_${wi}`).value.trim());
                        p.groups.push({ category: cat, words: words });
                    }
                } else if (gameId === 'chain') {
                    p.name = document.getElementById('f_c_name').value || "שרשרת";
                    p.start = document.getElementById('f_c_start').value.trim();
                    p.end = document.getElementById('f_c_end').value.trim();
                    p.middle = [];
                    document.querySelectorAll('#chain-middle-container > div').forEach(row => {
                        const word = row.querySelector('.f_m_word').value.trim();
                        const explanation = row.querySelector('.f_m_exp').value.trim();
                        if(word) p.middle.push({ word, explanation });
                    });
                    const distStr = document.getElementById('f_c_distractors').value;
                    p.distractors = distStr ? distStr.split(',').map(s => s.trim()).filter(Boolean) : [];
                } else if (gameId === 'wordle') {
                    p.word = document.getElementById('f_w').value.trim();
                    p.clue = document.getElementById('f_c').value.trim();
                    if(p.word.length !== 6) return showToast('שגיאה: המילה חייבת להיות 6 אותיות!', true);
                } else if (gameId === 'questions20') {
                    p.title = document.getElementById('f_20_title').value || "שאלון";
                    p.items = [];
                    document.querySelectorAll('#questions-items-container > div').forEach(row => {
                        const q = row.querySelector('.q_item_q').value.trim();
                        const a = row.querySelector('.q_item_a').value.trim();
                        if(q && a) p.items.push({ q, a });
                    });
                } else if (gameId === 'logicRiddle') {
                    p.riddle = document.getElementById('f_r').value;
                    p.answer = document.getElementById('f_a').value; 
                    p.date = document.getElementById('f_d').value;
                } else if (gameId === 'progressiveImage') {
                    p.answer = document.getElementById('f_ans').value;
                    p.steps = [];
                    for(let i=0; i<6; i++) p.steps.push(document.getElementById(`f_img_${i}`).value);
                }

                if (isNew) {
                    if (gameId === 'progressiveImage') data[gameId].puzzles = [p];
                    else data[gameId].puzzles.push(p);
                } else {
                    data[gameId].puzzles[puzzleIndex] = p;
                }

                await saveAppData(data);
                router.navigate('admin', {gameId});
            } catch (err) {
                showToast('שגיאה בשמירה. בדוק את הנתונים.', true);
                console.error(err);
            }
        };

        window.onload = () => router.navigate('hub', {isAdmin: false});
    </script>
</body>
</html>
